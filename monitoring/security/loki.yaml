auth_enabled: false
analytics:
  reporting_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  # Loki advertises CT121's management IP for its internal gRPC services.
  # Listen on that same IP; no inbound gRPC firewall rule is needed.
  grpc_listen_address: 192.168.150.21
  grpc_listen_port: 9096
  log_level: warn
common:
  path_prefix: /var/lib/meowcloud-loki
  storage:
    filesystem:
      chunks_directory: /var/lib/meowcloud-loki/chunks
      rules_directory: /var/lib/meowcloud-loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 72h
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_query_lookback: 72h
compactor:
  working_directory: /var/lib/meowcloud-loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
