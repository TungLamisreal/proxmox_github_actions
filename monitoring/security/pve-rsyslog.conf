# Forward only actual Proxmox firewall events.
module(load="imfile")
input(type="imfile" File="/var/log/pve-firewall.log" Tag="meow-pvefw:" Facility="local5" Severity="notice" PersistStateInterval="20" freshStartTail="on")
if ($syslogtag startswith "meow-pvefw:") then {
  action(type="omfwd" target="192.168.150.21" port="5514" protocol="udp" template="RSYSLOG_TraditionalForwardFormat")
  stop
}
