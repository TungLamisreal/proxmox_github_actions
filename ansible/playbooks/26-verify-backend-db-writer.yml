---
# Read only. Require every Backend container to carry the writer VIP, not
# DB01 or the last elected Patroni leader. Check is independent of image version.
- name: Prove all Backend containers consume stable PostgreSQL writer VIP
  hosts: backends
  become: true
  gather_facts: false
  tasks:
    - name: Query DB_HOST inside the live Backend Docker container without dumping secrets
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - meow-backend-app
          - python
          - -c
          - "import os,sys; sys.exit(0 if os.getenv('DB_HOST') == '192.168.150.100' else 1)"
      register: db_host_test
      changed_when: false

    - name: Verify the PostgreSQL writer VIP is reachable from the Backend network
      ansible.builtin.wait_for:
        host: 192.168.150.100
        port: 5432
        timeout: 10

    - name: Verify SQL read when the chosen app release supports db-health (baseline may 404)
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/db-health
        status_code: [200, 404]
        return_content: true
        timeout: 8
      register: backend_db_sql
      changed_when: false

    - name: Require real SQL health not just TCP 5432
      ansible.builtin.assert:
        that:
          - backend_db_sql.status == 404 or backend_db_sql.json.status | default('') == 'UP'
        fail_msg: "Backend DB health failed despite writer VIP TCP connectivity."
