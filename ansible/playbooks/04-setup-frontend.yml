---
- name: Configure Web Frontend Elastic Pool (Dockerized)
  hosts: frontends
  become: true
  gather_facts: true

  tasks:
    - name: Install dependencies and Node Exporter
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Python SDK
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - python3-docker
        state: present
        lock_timeout: 300

    - name: Ensure services are running and enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    - name: Create Frontend App and Config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/meow-frontend/html
        - /opt/meow-frontend/conf

    - name: Deploy Nginx Reverse Proxy Configuration (Dynamic Upstream)
      ansible.builtin.copy:
        dest: /opt/meow-frontend/conf/default.conf
        mode: '0644'
        content: |
          upstream backend_cluster {
          {% for host in groups['backends'] %}
              server {{ hostvars[host]['ansible_host'] }}:5000 max_fails=3 fail_timeout=10s;
          {% endfor %}
          }

          server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /api/ {
                  proxy_pass http://backend_cluster/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
      register: nginx_fe_conf

    - name: Deploy MeowCloud E-Commerce Web UI
      ansible.builtin.copy:
        dest: /opt/meow-frontend/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>MeowCloud E-Commerce (Docker)</title>
              <style>
                  body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding-top: 80px; }
                  .card { background: #1e293b; display: inline-block; padding: 30px; border: 1px solid #38bdf8; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🚀 MEOWCLOUD FRONTEND</h1>
                  <p>Phục vụ bởi Docker Container trên Host: {{ inventory_hostname }}</p>
                  <p>IP Nội bộ: {{ ansible_host }}</p>
              </div>
          </body>
          </html>

    - name: Run Frontend Web Container (Idempotent)
      community.docker.docker_container:
        name: meow-frontend-app
        image: nginx:alpine
        state: started
        restart: "{{ nginx_fe_conf.changed }}"
        restart_policy: always
        published_ports:
          - "80:80"
        volumes:
          - "/opt/meow-frontend/html:/usr/share/nginx/html:ro"
          - "/opt/meow-frontend/conf/default.conf:/etc/nginx/conf.d/default.conf:ro"
