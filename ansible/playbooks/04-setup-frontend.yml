---
- name: Configure Web Frontend Elastic Pool (Pre-baked Golden Template)
  hosts: frontends
  become: true
  gather_facts: false
  serial: "{{ meow_rolling_batch_size | default('100%') }}"
  vars:
    meow_release: "{{ (lookup('ansible.builtin.file', '/opt/meowcloud-iac/state/app-release.json', errors='ignore') | default('{}', true)) | from_json }}"
    meow_selected_frontend_image: "{{ meow_frontend_image | default(meow_release.frontend_image | default('nginx:alpine')) }}"
    meow_remote_frontend: "{{ meow_selected_frontend_image.startswith('ghcr.io/') }}"
    meow_expected_version: "{{ meow_app_version | default(meow_release.version | default('')) }}"
  tasks:
    - name: Ensure Docker and Node Exporter active on Frontend
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    - name: Refuse an unexpected host Nginx package
      ansible.builtin.command: dpkg-query -W -f='${db:Status-Abbrev}' nginx
      register: host_nginx_pkg
      failed_when: host_nginx_pkg.rc == 0 and host_nginx_pkg.stdout is match('^ii')
      changed_when: false

    - name: Inspect requested Frontend image locally
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ meow_selected_frontend_image }}"]
      register: meow_fe_image_local
      changed_when: false
      failed_when: false

    - name: Require credentials before pulling an uncached GHCR release
      ansible.builtin.assert:
        that:
          - lookup('env', 'GHCR_USERNAME') | length > 0
          - lookup('env', 'GHCR_TOKEN') | length > 0
        fail_msg: "GHCR image is missing locally; set GHCR_USERNAME and GHCR_TOKEN in Actions."
      when: meow_remote_frontend and meow_fe_image_local.rc != 0
      no_log: true

    - name: Pull pinned Frontend application release from GHCR
      when: meow_remote_frontend and meow_fe_image_local.rc != 0
      block:
        - name: Authenticate with GHCR (temporary)
          community.docker.docker_login:
            registry_url: ghcr.io
            username: "{{ lookup('env', 'GHCR_USERNAME') }}"
            password: "{{ lookup('env', 'GHCR_TOKEN') }}"
          no_log: true
        - name: Pull immutable Frontend image
          ansible.builtin.command:
            argv: [docker, pull, "{{ meow_selected_frontend_image }}"]
      always:
        - name: Remove temporary GHCR Docker login
          community.docker.docker_login:
            registry_url: ghcr.io
            state: absent
          no_log: true

    - name: Require local Frontend image (fail closed)
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ meow_selected_frontend_image }}"]
      changed_when: false

    - name: Create Frontend App and Config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/meow-frontend/html
        - /opt/meow-frontend/conf

    - name: Deploy Nginx Reverse Proxy Configuration (Dynamic Upstream + Gzip CPU Load)
      ansible.builtin.copy:
        dest: /opt/meow-frontend/conf/default.conf
        mode: '0644'
        content: |
          upstream backend_cluster {
          {% for host in groups['backends'] %}
              server {{ hostvars[host]['ansible_host'] }}:5000 max_fails=3 fail_timeout=10s;
          {% endfor %}
          }

          server {
              listen 80;
              server_name _;

              # Bật nén Gzip mức 9 để vừa tối ưu băng thông vừa dễ test tải CPU Frontend
              gzip on;
              gzip_comp_level 9;
              gzip_min_length 128;
              gzip_proxied any;
              gzip_types text/plain text/css application/json application/javascript;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /api/ {
                  proxy_pass http://backend_cluster/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
      register: nginx_fe_conf

    - name: Deploy legacy MeowCloud Web UI only for Golden Image baseline
      when: not meow_remote_frontend
      ansible.builtin.copy:
        dest: /opt/meow-frontend/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="vi">
          <head>
              <meta charset="UTF-8">
              <title>MeowCloud E-Commerce Platform</title>
              <style>
                  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 40px; }
                  .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
                  h1 { color: #38bdf8; }
                  pre { background: #020617; padding: 16px; border-radius: 8px; color: #4ade80; text-align: left; overflow-x: auto; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🐾 MeowCloud Elastic Infrastructure</h1>
                  <p>Served by Frontend LXC: <strong>{{ inventory_hostname }} ({{ ansible_host }})</strong></p>
                  <button onclick="checkApi()" style="padding:10px 20px;background:#38bdf8;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Kiểm tra kết nối Backend API</button>
                  <pre id="out">Đang chờ gọi /api/health...</pre>
              </div>
              <script>
                  async function checkApi() {
                      const res = await fetch('/api/health');
                      const data = await res.json();
                      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
                  }
                  checkApi();
              </script>
          </body>
          </html>

    - name: Run Frontend Nginx Container (Instant Start from Pre-baked Image)
      community.docker.docker_container:
        name: meow-frontend-app
        image: "{{ meow_selected_frontend_image }}"
        pull: never
        state: started
        restart_policy: always
        published_ports:
          - "80:80"
        volumes: >-
          {{ ['/opt/meow-frontend/conf/default.conf:/etc/nginx/conf.d/default.conf:ro'] +
             (['/opt/meow-frontend/html:/usr/share/nginx/html:ro'] if not meow_remote_frontend else []) }}
      register: fe_container

    - name: Zero-Downtime Reload Nginx inside container when upstream changes
      ansible.builtin.command: docker exec meow-frontend-app nginx -s reload
      when:
        - nginx_fe_conf.changed
        - not fe_container.changed

    - name: Require Docker publishing host port 80
      ansible.builtin.command: docker port meow-frontend-app 80/tcp
      register: fe_port
      changed_when: false
      failed_when: fe_port.rc != 0 or ':80' not in fe_port.stdout

    - name: Health-check actual MeowCloud UI (HTTP 200 alone is insufficient)
      ansible.builtin.uri:
        url: http://127.0.0.1:80/
        status_code: 200
        return_content: true
      register: fe_health
      retries: 8
      delay: 2
      until: >-
        fe_health.status == 200 and
        'MeowCloud Elastic Infrastructure' in (fe_health.content | default(''))

    - name: Verify pinned Frontend application version
      ansible.builtin.uri:
        url: http://127.0.0.1:80/version.json
        return_content: true
        status_code: 200
      register: meow_fe_version_check
      retries: 5
      delay: 2
      until: meow_fe_version_check.json.version | default('') == meow_expected_version
      when: meow_remote_frontend and meow_expected_version | length > 0
