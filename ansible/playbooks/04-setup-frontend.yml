---
- name: Configure Web Frontend Elastic Pool (Dockerized)
  hosts: frontends
  become: true
  gather_facts: true

  tasks:
    # Bắt đầu ngay từ bước kiểm tra service (Đã bỏ 5 task cài APT & Docker)
    - name: Ensure services are running and enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    - name: Create Frontend App and Config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/meow-frontend/html
        - /opt/meow-frontend/conf

    - name: Deploy Nginx Reverse Proxy Configuration (Dynamic Upstream)
      ansible.builtin.copy:
        dest: /opt/meow-frontend/conf/default.conf
        mode: '0644'
        validate: '/usr/sbin/nginx -t -c %s'
        content: |
          upstream backend_cluster {
          {% for host in groups['backends'] %}
              server {{ hostvars[host]['ansible_host'] }}:5000 max_fails=3 fail_timeout=10s;
          {% endfor %}
          }

          server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /api/ {
                  proxy_pass http://backend_cluster/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
      register: nginx_fe_conf

    - name: Deploy MeowCloud E-Commerce Web UI
      ansible.builtin.copy:
        dest: /opt/meow-frontend/html/index.html
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>MeowCloud E-Commerce (Docker)</title>
              <style>
                  body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding-top: 80px; }
                  .card { background: #1e293b; display: inline-block; padding: 30px; border: 1px solid #38bdf8; }
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🚀 MEOWCLOUD FRONTEND</h1>
                  <p>Phục vụ bởi Docker Container trên Host: {{ inventory_hostname }}</p>
                  <p>IP Nội bộ: {{ ansible_host }}</p>
              </div>
          </body>
          </html>

    - name: Run Frontend Web Container (Idempotent)
      community.docker.docker_container:
        name: meow-frontend-app
        image: nginx:alpine
        state: started
        restart: "{{ nginx_fe_conf.changed }}"
        restart_policy: always
        published_ports:
          - "80:80"
        volumes:
          - "/opt/meow-frontend/html:/usr/share/nginx/html:ro"
          - "/opt/meow-frontend/conf/default.conf:/etc/nginx/conf.d/default.conf:ro"
    # (Tùy chọn) Thêm task này vào cuối file để tự động kiểm tra Web UI không bị 404:
    - name: Health-check Frontend Web UI (:80)
      ansible.builtin.uri:
        url: http://127.0.0.1:80/
        status_code: 200
      register: fe_health
      retries: 5
      delay: 2
      until: fe_health.status == 200
