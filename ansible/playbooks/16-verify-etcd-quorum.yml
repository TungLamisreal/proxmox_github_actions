---
# DB06 can rerun this read-only stage separately from provisioning.
- name: Verify three-voter quorum and secure full endpoint connectivity
  hosts: observer
  become: true
  gather_facts: false
  vars:
    endpoints: "https://192.168.150.71:2379,https://192.168.150.72:2379,https://192.168.150.21:2379"
    etcdctl_base:
      - /usr/bin/etcdctl
      - "--endpoints={{ endpoints }}"
      - --cacert=/etc/meowcloud/tls/ca.pem
      - --cert=/etc/meowcloud/tls/etcd-server.pem
      - --key=/etc/meowcloud/tls/etcd-server-key.pem
  tasks:
    - name: Require full cluster membership after first startup
      ansible.builtin.command:
        argv: "{{ etcdctl_base + ['member', 'list', '-w', 'json'] }}"
      environment:
        ETCDCTL_API: "3"
      register: etcd_members
      changed_when: false
      retries: 12
      delay: 5
      until: etcd_members.rc == 0

    - name: Refuse partial or duplicated etcd quorum
      ansible.builtin.assert:
        that:
          - (etcd_members.stdout | from_json).members | length == 3
          - >-
            ((etcd_members.stdout | from_json).members
              | map(attribute='name') | list | sort) == ['db-01', 'db-02', 'observer']
        fail_msg: "Etcd cluster has wrong membership; no PostgreSQL leader automation is permitted."

    - name: Require all three HTTPS endpoints to answer etcd consensus health
      ansible.builtin.command:
        argv: "{{ etcdctl_base + ['endpoint', 'health'] }}"
      environment:
        ETCDCTL_API: "3"
      register: etcd_health
      changed_when: false
      retries: 10
      delay: 5
      until: etcd_health.rc == 0

    - name: Verify Patroni-compatible HTTPS JSON gateway on all three etcd members
      ansible.builtin.uri:
        url: "{{ item }}"
        method: POST
        body_format: json
        body: {}
        client_cert: /etc/meowcloud/tls/etcd-server.pem
        client_key: /etc/meowcloud/tls/etcd-server-key.pem
        ca_path: /etc/meowcloud/tls/ca.pem
        validate_certs: true
        status_code: 200
        timeout: 5
        return_content: true
      loop:
        - https://192.168.150.71:2379/v3/cluster/member/list
        - https://192.168.150.72:2379/v3/cluster/member/list
        - https://192.168.150.21:2379/v3/cluster/member/list
      register: gateway_response
      changed_when: false

    - name: Reject HTTP 404, missing gateway or incomplete JSON cluster replies
      ansible.builtin.assert:
        that:
          - gateway_response.results | length == 3
          - gateway_response.results | map(attribute='json.members') | map('length') | list == [3,3,3]
        fail_msg: "Native etcdctl gRPC is healthy but Patroni /v3 JSON gateway is not; run DB07 gateway-repair first."

    - name: Report verified DCS and Patroni HTTP gateway, not a PostgreSQL takeover
      ansible.builtin.debug:
        msg: "PASS: etcd 3/3 gRPC quorum AND Patroni /v3 JSON HTTPS gateway healthy over mTLS."
