---
- name: Configure Cloudflare Tunnels (Ingress Edge - Golden Image)
  hosts: tunnels
  become: true
  gather_facts: false
  vars:
    cf_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"

  tasks:
    - name: Ensure Node Exporter is running and enabled (Baked in Golden Image)
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Check if cloudflared binary is already installed
      ansible.builtin.stat:
        path: /usr/bin/cloudflared
      register: cloudflared_bin

    - name: Download cloudflared Debian package
      ansible.builtin.get_url:
        url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        dest: /tmp/cloudflared.deb
        mode: '0644'
      when: not cloudflared_bin.stat.exists

    - name: Install cloudflared package from local deb
      ansible.builtin.apt:
        deb: /tmp/cloudflared.deb
        lock_timeout: 300
      when: not cloudflared_bin.stat.exists

    - name: Register and start Cloudflare Tunnel service
      ansible.builtin.shell: |
        if [ ! -f /etc/systemd/system/cloudflared.service ]; then
          cloudflared service install {{ cf_token }}
        fi
      when: cf_token | length > 0
      no_log: true
