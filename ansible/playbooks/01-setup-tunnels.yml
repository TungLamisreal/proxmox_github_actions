---
- name: Configure Cloudflare Tunnels (Ingress Edge - Golden Image)
  hosts: tunnels
  become: true
  gather_facts: false
  vars:
    cf_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"

  tasks:
    - name: Require the canonical pfSense LAN gateway
      ansible.builtin.assert:
        that:
          - network_gateway | default('') == '192.168.150.1'
        fail_msg: "Tunnel inventory must set network_gateway=192.168.150.1."

    - name: Read the current default route
      ansible.builtin.command: ip -4 route show default
      register: tunnel_default_route
      changed_when: false

    - name: Converge the running default route to pfSense
      ansible.builtin.command:
        argv:
          - ip
          - -4
          - route
          - replace
          - default
          - via
          - "{{ network_gateway }}"
          - dev
          - eth0
      when: ("via " ~ network_gateway ~ " dev eth0") not in tunnel_default_route.stdout

    - name: Verify Cloudflare egress uses pfSense
      ansible.builtin.command: ip -4 route get 1.1.1.1
      register: tunnel_egress_route
      changed_when: false

    - name: Abort before cloudflared when the route is incorrect
      ansible.builtin.assert:
        that:
          - ("via " ~ network_gateway) in tunnel_egress_route.stdout
          - "'dev eth0' in tunnel_egress_route.stdout"
        fail_msg: "Cloudflare Tunnel egress is not using pfSense 192.168.150.1."

    - name: Ensure Node Exporter is running and enabled (Baked in Golden Image)
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Require cloudflared from the Tunnel Golden Image
      ansible.builtin.stat:
        path: /usr/bin/cloudflared
      register: cloudflared_bin

    - name: Abort if image lacks cloudflared
      ansible.builtin.assert:
        that:
          - cloudflared_bin.stat.exists
          - cf_token | length > 0
        fail_msg: "Missing cloudflared or CLOUDFLARE_TUNNEL_TOKEN."
      no_log: true

    - name: Register and start Cloudflare Tunnel service
      ansible.builtin.shell: |
        if [ ! -f /etc/systemd/system/cloudflared.service ]; then
          cloudflared service install {{ cf_token }}
        fi
      no_log: true

    - name: Verify Cloudflare tunnel service is running
      ansible.builtin.command: systemctl is-active cloudflared
      changed_when: false
