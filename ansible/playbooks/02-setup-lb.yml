---
- name: Configure Nginx HA Load Balancers & Keepalived VIP (.100)
  hosts: loadbalancers
  become: true  # BẮT BUỘC để có quyền chạy apt và sửa file system
  gather_facts: true

  tasks:
    - name: Install Nginx, Keepalived, Node Exporter and psmisc
      ansible.builtin.apt:
        name:
          - nginx
          - keepalived
          - prometheus-node-exporter
          - psmisc  # Cung cấp lệnh killall cho Keepalived VRRP Script
        state: present
        update_cache: true
        lock_timeout: 300  # Tránh lỗi dpkg lock khi apt đang chạy ngầm

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Render dynamic Upstream Load Balancer configuration
      ansible.builtin.template:
        src: ../templates/loadbalancer.conf.j2
        dest: /etc/nginx/conf.d/loadbalancer.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Configure Keepalived for VIP 192.168.150.100
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_script chk_nginx {
              script "/usr/bin/killall -0 nginx"
              interval 2
              weight -20   # QUAN TRỌNG: Trừ 20 điểm nếu Nginx sập (Master 100-20=80 < Backup 90)
              fall 2
              rise 2
          }

          vrrp_instance VI_MEOW_LB {
              state {{ keepalived_state | default('BACKUP') }}
              interface eth0
              virtual_router_id 51
              priority {{ keepalived_priority | default(90) }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass MeowLB100
              }

              virtual_ipaddress {
                  192.168.150.100/24
              }

              track_script {
                  chk_nginx
              }
          }
      notify: Restart Keepalived

    - name: Ensure services are enabled and started
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - keepalived
        - prometheus-node-exporter

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart Keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
