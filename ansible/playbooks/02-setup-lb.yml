---
- name: Configure Nginx HA Load Balancers & Keepalived VIP (.100)
  hosts: loadbalancers
  become: true
  gather_facts: false
  tasks:
    - name: Read pre-baked package inventory
      ansible.builtin.package_facts:
        manager: apt

    - name: Require LB golden image packages
      ansible.builtin.assert:
        that:
          - "'nginx' in ansible_facts.packages"
          - "'keepalived' in ansible_facts.packages"
        fail_msg: "Missing nginx/keepalived in LB role image; rebuild workflow 00."

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Configure Nginx worker_shutdown_timeout for Graceful Connection Draining
      ansible.builtin.lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '^worker_shutdown_timeout'
        insertbefore: '^http\s*\{'
        line: 'worker_shutdown_timeout 15s;'
        state: present
      notify: Reload Nginx

    - name: Render dynamic Upstream Load Balancer configuration
      ansible.builtin.template:
        src: ../templates/loadbalancer.conf.j2
        dest: /etc/nginx/conf.d/loadbalancer.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Validate Nginx configuration safely
      ansible.builtin.command: /usr/sbin/nginx -t
      changed_when: false

    - name: Configure Keepalived for VIP 192.168.150.100
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        mode: '0644'
        content: |
          vrrp_script chk_nginx {
              script "/usr/bin/killall -0 nginx"
              interval 2
              weight -20
              fall 2
              rise 2
          }
          vrrp_instance VI_MEOW_LB {
              state {{ keepalived_state | default('BACKUP') }}
              interface eth0
              virtual_router_id 51
              priority {{ keepalived_priority | default(90) }}
              advert_int 1
              authentication {
                  auth_type PASS
                  auth_pass MeowLB100
              }
              virtual_ipaddress {
                  192.168.150.100/24
              }
              track_script {
                  chk_nginx
              }
          }
      notify: Restart Keepalived

    - name: Ensure LB and monitoring services are enabled and started
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - keepalived
        - prometheus-node-exporter

    - name: Flush handlers to apply Nginx/Keepalived configs immediately
      ansible.builtin.meta: flush_handlers

    - name: Health-check local Nginx Load Balancer status endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/lb-status
        return_content: true
        status_code: 200

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
    - name: Restart Keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
