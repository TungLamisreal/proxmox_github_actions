---
- name: Configure Backend API Elastic Pool (Dockerized)
  hosts: backends
  gather_facts: yes
  tasks:
    - name: Install dependencies and Node Exporter
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker and Node Exporter are running
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - docker
        - prometheus-node-exporter

    - name: Create Backend App directory
      file:
        path: /opt/meow-backend
        state: directory

    - name: Create Dockerfile for Backend API
      copy:
        dest: /opt/meow-backend/Dockerfile
        content: |
          FROM python:3.9-slim
          WORKDIR /app
          RUN pip install flask psycopg2-binary gunicorn
          COPY app.py .
          CMD ["gunicorn", "--workers=2", "--bind=0.0.0.0:5000", "app:app"]

    - name: Deploy Backend API application source
      copy:
        dest: /opt/meow-backend/app.py
        content: |
          from flask import Flask, jsonify
          import socket

          app = Flask(__name__)

          @app.route('/')
          @app.route('/health')
          def health():
              return jsonify({
                  "service": "MeowCloud Backend API (Docker)",
                  "node": socket.gethostname(),
                  "db_primary": "192.168.150.71",
                  "status": "UP"
              })

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)

    - name: Build and Run Backend API Container
      shell: |
        cd /opt/meow-backend
        docker build -t meow-backend:latest .
        docker run -d --name meow-backend-app --restart always -p 5000:5000 meow-backend:latest
