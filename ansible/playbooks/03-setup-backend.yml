---
- name: Configure Backend API Elastic Pool (Golden Image Docker LXC)
  hosts: backends
  become: true
  gather_facts: false

  tasks:
    - name: Ensure Docker and Node Exporter services are active (Baked in Golden Image)
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    - name: Create Backend App directory
      ansible.builtin.file:
        path: /opt/meow-backend
        state: directory
        mode: '0755'

    - name: Create Dockerfile for Backend API
      ansible.builtin.copy:
        dest: /opt/meow-backend/Dockerfile
        mode: '0644'
        content: |
          FROM python:3.9-slim
          WORKDIR /app
          RUN pip install --no-cache-dir flask psycopg2-binary gunicorn
          COPY app.py .
          CMD ["gunicorn", "--workers=2", "--bind=0.0.0.0:5000", "app:app"]

    - name: Deploy Backend API application source
      ansible.builtin.copy:
        dest: /opt/meow-backend/app.py
        mode: '0644'
        content: |
          from flask import Flask, jsonify
          import socket
          app = Flask(__name__)
          @app.route('/')
          @app.route('/health')
          def health():
              return jsonify({
                  "service": "MeowCloud Backend API (Docker)",
                  "node": socket.gethostname(),
                  "db_primary": "192.168.150.71",
                  "status": "UP"
              })
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)

    - name: Build Backend Docker Image
      community.docker.docker_image:
        name: meow-backend
        tag: latest
        build:
          path: /opt/meow-backend
        source: build
        state: present

    - name: Run Backend API Container (Idempotent)
      community.docker.docker_container:
        name: meow-backend-app
        image: meow-backend:latest
        state: started
        restart_policy: always
        published_ports:
          - "5000:5000"

    - name: Health-check Backend API local endpoint (:5000/health)
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        return_content: true
        status_code: 200
      register: be_health
      retries: 5
      delay: 2
      until: be_health.status == 200
