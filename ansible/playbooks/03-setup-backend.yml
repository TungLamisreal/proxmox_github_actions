---
- name: Configure Backend API Elastic Pool (pre-baked Docker image)
  hosts: backends
  become: true
  gather_facts: false
  tasks:
    - name: Ensure Docker and Node Exporter active
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    - name: Require pre-baked Backend Docker image
      ansible.builtin.command: docker image inspect meow-backend:latest
      changed_when: false

    - name: Run Backend API container without network pull or build
      community.docker.docker_container:
        name: meow-backend-app
        image: meow-backend:latest
        pull: never
        state: started
        restart_policy: always
        hostname: "{{ inventory_hostname }}"
        published_ports:
          - "5000:5000"

    - name: Verify Backend health
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/health
        return_content: true
        status_code: 200
      register: be_health
      retries: 8
      delay: 2
      until: >-
        be_health.status == 200 and
        be_health.json.status | default('') == 'UP'
