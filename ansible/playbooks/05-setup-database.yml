---
- name: Configure KVM Database Cluster (Dockerized Postgres)
  hosts: databases
  become: true
  vars:
    pg_mount_point: /opt/pgdata
    pg_data_dir: /opt/pgdata/data
    pg_device: /dev/sdb

  tasks:
    # =========================================================================
    # Quản lý Filesystem & Mount an toàn, Idempotent
    # =========================================================================
    - name: Check existing filesystem on second disk
      ansible.builtin.command: "blkid -s TYPE -o value {{ pg_device }}"
      register: sdb_fstype
      failed_when: false
      changed_when: false

    - name: Abort if unexpected filesystem exists on second disk
      ansible.builtin.fail:
        msg: "CRITICAL: {{ pg_device }} has unexpected filesystem '{{ sdb_fstype.stdout }}'. Aborting to protect data!"
      when:
        - sdb_fstype.rc == 0
        - sdb_fstype.stdout != ""
        - sdb_fstype.stdout != "ext4"

    - name: Format second disk as ext4 only if unformatted
      community.general.filesystem:
        fstype: ext4
        dev: "{{ pg_device }}"
        force: false

    - name: Ensure mount point directory exists
      ansible.builtin.file:
        path: "{{ pg_mount_point }}"
        state: directory
        mode: '0755'

    - name: Mount second disk to /opt/pgdata
      ansible.posix.mount:
        path: "{{ pg_mount_point }}"
        src: "{{ pg_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    # =========================================================================
    # Tạo thư mục con /opt/pgdata/data (tránh đụng lost+found)
    # =========================================================================
    - name: Create PostgreSQL data subdirectory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        mode: '0750'

    # =========================================================================
    # Dependencies, Node Exporter & APT lock_timeout
    # =========================================================================
    - name: Install dependencies and Node Exporter
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Ensure Node Exporter service is running and enabled
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    # =========================================================================
    # Cài đặt Docker Engine theo trạng thái khai báo (Idempotent)
    # =========================================================================
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker packages and Python Docker SDK
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker
        state: present
        lock_timeout: 300

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # =========================================================================
    # Quản lý PostgreSQL Container Idempotent qua community.docker
    # =========================================================================
    - name: Verify vault_postgres_password is loaded
      ansible.builtin.assert:
        that:
          - vault_postgres_password is defined
          - vault_postgres_password | length > 0
        fail_msg: "vault_postgres_password is not set! Pass --vault-password-file."
      no_log: true

    - name: Run PostgreSQL Docker Container
      community.docker.docker_container:
        name: meow-postgres
        image: postgres:15-alpine
        state: started
        restart_policy: always
        published_ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
        volumes:
          - "{{ pg_data_dir }}:/var/lib/postgresql/data"
