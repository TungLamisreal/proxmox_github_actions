---
- name: Configure KVM Database Cluster (Golden Image KVM Dockerized Postgres)
  hosts: databases
  become: true
  gather_facts: false
  vars:
    pg_mount_point: /opt/pgdata
    pg_data_dir: /opt/pgdata/data
    pg_device: /dev/sdb

  tasks:
    # =========================================================================
    # Quản lý Filesystem & Mount an toàn, Idempotent
    # =========================================================================
    - name: Check existing filesystem on second disk
      ansible.builtin.command: "blkid -s TYPE -o value {{ pg_device }}"
      register: sdb_fstype
      failed_when: false
      changed_when: false

    - name: Abort if unexpected filesystem exists on second disk
      ansible.builtin.fail:
        msg: "CRITICAL: {{ pg_device }} has unexpected filesystem '{{ sdb_fstype.stdout }}'. Aborting to protect data!"
      when:
        - sdb_fstype.rc == 0
        - sdb_fstype.stdout != ""
        - sdb_fstype.stdout != "ext4"

    - name: Recovery - Unmount if disk is stuck in mounted state (Fix db-02)
      ansible.posix.mount:
        path: "{{ pg_mount_point }}"
        state: unmounted
      failed_when: false
      when: sdb_fstype.stdout != "ext4"

    - name: Recovery - Clear active device-mapper kernel locks (Fix db-01)
      ansible.builtin.command: dmsetup remove_all
      failed_when: false
      changed_when: false
      when: sdb_fstype.stdout != "ext4"

    - name: Recovery - Wipe leftover signatures safely
      ansible.builtin.command: "wipefs -a -f {{ pg_device }}"
      failed_when: false
      changed_when: false
      when: sdb_fstype.stdout != "ext4"

    - name: Format second disk as ext4 only if unformatted
      community.general.filesystem:
        fstype: ext4
        dev: "{{ pg_device }}"
        force: true
      when: sdb_fstype.stdout != "ext4"

    - name: Ensure mount point directory exists
      ansible.builtin.file:
        path: "{{ pg_mount_point }}"
        state: directory
        mode: '0755'

    - name: Mount second disk to /opt/pgdata
      ansible.posix.mount:
        path: "{{ pg_mount_point }}"
        src: "{{ pg_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    - name: Create PostgreSQL data subdirectory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        mode: '0750'

    # =========================================================================
    # Kích hoạt Services đã đóng gói sẵn trong KVM Golden Image
    # =========================================================================
    - name: Ensure Docker and Node Exporter services are running and enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - prometheus-node-exporter

    # =========================================================================
    # Quản lý PostgreSQL Container Idempotent qua community.docker
    # =========================================================================
    - name: Verify vault_postgres_password is loaded
      ansible.builtin.assert:
        that:
          - vault_postgres_password is defined
          - vault_postgres_password | length > 0
        fail_msg: "vault_postgres_password is not set! Pass --vault-password-file."
      no_log: true

    - name: Run PostgreSQL Docker Container
      community.docker.docker_container:
        name: meow-postgres
        image: postgres:15-alpine
        state: started
        restart_policy: always
        published_ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: "{{ vault_postgres_password }}"
        volumes:
          - "{{ pg_data_dir }}:/var/lib/postgresql/data"

    - name: Wait for PostgreSQL port 5432 to become active
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        delay: 2
        timeout: 60
