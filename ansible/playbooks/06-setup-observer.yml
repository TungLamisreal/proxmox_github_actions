---
- name: Configure Observer (Prometheus, Alertmanager & Auto-Scale Alerting)
  hosts: monitoring
  become: true
  gather_facts: true
  tasks:
    - name: Install Prometheus and Alertmanager
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-alertmanager
        state: present
        update_cache: true
        lock_timeout: 300

    - name: Generate Prometheus Alert Rules for Scale-Out and Scale-In
      ansible.builtin.copy:
        dest: /etc/prometheus/alert.rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          {% raw %}
          groups:
            - name: meowcloud_autoscale_rules
              interval: 10s
              rules:
                # --- QUY TẮC SCALE-OUT (TĂNG MÁY KHI QUÁ TẢI > 80%) ---
                - alert: BackendPoolHighCPU
                  expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="backends",mode="idle"}[1m])) * 100) > 80
                  for: 30s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "backend"
                  annotations:
                    summary: "Cụm Backend quá tải CPU (> 80%)"
                    description: "Instance Backend có CPU đạt {{ $value | printf \"%.2f\" }}% trong hơn 30 giây."

                - alert: FrontendPoolHighCPU
                  expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="frontends",mode="idle"}[1m])) * 100) > 80
                  for: 30s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "frontend"
                  annotations:
                    summary: "Cụm Frontend quá tải CPU (> 80%)"
                    description: "Instance Frontend có CPU đạt {{ $value | printf \"%.2f\" }}% trong hơn 30 giây."

                # --- QUY TẮC SCALE-IN (THU HỒI MÁY KHI TẢI THẤP < 20% VÀ SỐ MÁY > 3) ---
                - alert: BackendPoolLowCPU
                  expr: >
                    (avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{job="backends",mode="idle"}[1m])) * 100)) < 20)
                    and
                    (count(up{job="backends"} == 1) > 3)
                  for: 1m
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "backend"
                  annotations:
                    summary: "Cụm Backend tải thấp (< 20%) và dư thừa tài nguyên (> 3 LXC)"
                    description: "CPU trung bình toàn cụm Backend chỉ đạt {{ $value | printf \"%.2f\" }}% trong hơn 1 phút."

                - alert: FrontendPoolLowCPU
                  expr: >
                    (avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{job="frontends",mode="idle"}[1m])) * 100)) < 20)
                    and
                    (count(up{job="frontends"} == 1) > 3)
                  for: 1m
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "frontend"
                  annotations:
                    summary: "Cụm Frontend tải thấp (< 20%) và dư thừa tài nguyên (> 3 LXC)"
                    description: "CPU trung bình toàn cụm Frontend chỉ đạt {{ $value | printf \"%.2f\" }}% trong hơn 1 phút."
          {% endraw %}
      notify: Restart Prometheus

    - name: Validate Prometheus Alert Rules syntax with promtool
      ansible.builtin.command: promtool check rules /etc/prometheus/alert.rules.yml
      changed_when: false

    - name: Generate dynamic prometheus.yml scraping all MeowCloud tiers and linking Alertmanager
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            scrape_interval: 10s
            evaluation_interval: 10s
          rule_files:
            - /etc/prometheus/alert.rules.yml
          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - 'localhost:9093'
          scrape_configs:
            - job_name: 'observer'
              static_configs:
                - targets: ['localhost:9100']
            - job_name: 'tunnels'
              static_configs:
                - targets:
          {% for host in groups['tunnels'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'loadbalancers'
              static_configs:
                - targets:
          {% for host in groups['loadbalancers'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'backends'
              static_configs:
                - targets:
          {% for host in groups['backends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'frontends'
              static_configs:
                - targets:
          {% for host in groups['frontends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'databases'
              static_configs:
                - targets:
          {% for host in groups['databases'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
      notify: Restart Prometheus

    - name: Validate complete prometheus.yml configuration with promtool
      ansible.builtin.command: promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Configure Alertmanager to route Auto-Scale Webhooks to Auto-VM (192.168.150.20:5000)
      ansible.builtin.copy:
        dest: /etc/prometheus/alertmanager.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            resolve_timeout: 5m
          route:
            group_by: ['alertname', 'scale_target', 'scale_action']
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 5m
            receiver: 'default-noop'
            routes:
              - match:
                  autoscale: "true"
                receiver: 'meowcloud-autoscale-webhook'
          receivers:
            - name: 'default-noop'
            - name: 'meowcloud-autoscale-webhook'
              webhook_configs:
                - url: 'http://192.168.150.20:5000/webhook'
                  send_resolved: false
      notify: Restart Alertmanager

    - name: Ensure Prometheus, Alertmanager and Node Exporter are active
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - prometheus
        - prometheus-alertmanager
        - prometheus-node-exporter

    - name: Flush handlers to apply Prometheus and Alertmanager changes immediately
      ansible.builtin.meta: flush_handlers

    - name: Verify Prometheus Rules and Alertmanager API readiness
      ansible.builtin.uri:
        url: "{{ item }}"
        return_content: true
        status_code: 200
      register: api_check
      retries: 5
      delay: 3
      until: api_check.status == 200
      loop:
        - "http://127.0.0.1:9090/api/v1/rules"
        - "http://127.0.0.1:9093/-/ready"

  handlers:
    - name: Restart Prometheus
      ansible.builtin.service:
        name: prometheus
        state: restarted
    - name: Restart Alertmanager
      ansible.builtin.service:
        name: prometheus-alertmanager
        state: restarted
