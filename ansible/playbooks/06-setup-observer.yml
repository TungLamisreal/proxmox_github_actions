---
- name: Configure Observer (Prometheus, Alertmanager & Auto-Scale Alerting)
  hosts: monitoring
  become: true
  gather_facts: false
  tasks:
    - name: Read pre-baked package inventory
      ansible.builtin.package_facts:
        manager: apt

    - name: Require Observer golden image packages
      ansible.builtin.assert:
        that:
          - "'prometheus' in ansible_facts.packages"
          - "'prometheus-alertmanager' in ansible_facts.packages"
        fail_msg: "Missing Prometheus/Alertmanager in Observer role image; rebuild workflow 00."

    - name: Require promtool for fail-closed config validation
      ansible.builtin.command: promtool --version
      changed_when: false

    - name: Generate Prometheus Alert Rules for Scale-Out and Scale-In (Cgroup Quota Fix)
      ansible.builtin.copy:
        dest: /etc/prometheus/alert.rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        backup: true
        validate: 'promtool check rules %s'
        content: |
          {% raw %}
          groups:
            - name: meowcloud_autoscale_rules
              interval: 5s
              rules:
                # CPU is charged to each LXC cgroup (including nested Docker).
                # Normalize by Terraform vCPU allocations: 2 for BE, 1 for FE.
                # min(up)==1 prevents decisions when even one exporter is down.
                - alert: BackendPoolHighCPU
                  expr: ((100 * sum(rate(meowcloud_lxc_cpu_usage_seconds_total{job="lxc_backends"}[1m])) / sum(meowcloud_lxc_cpu_capacity_cores{job="lxc_backends"})) > 80) and on() (min(up{job="lxc_backends"}) == 1)
                  for: 10s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "backend"

                - alert: FrontendPoolHighCPU
                  expr: ((100 * sum(rate(meowcloud_lxc_cpu_usage_seconds_total{job="lxc_frontends"}[1m])) / sum(meowcloud_lxc_cpu_capacity_cores{job="lxc_frontends"})) > 80) and on() (min(up{job="lxc_frontends"}) == 1)
                  for: 10s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "frontend"

                - alert: BackendPoolLowCPU
                  expr: ((100 * sum(rate(meowcloud_lxc_cpu_usage_seconds_total{job="lxc_backends"}[1m])) / sum(meowcloud_lxc_cpu_capacity_cores{job="lxc_backends"})) < 10) and on() (count(up{job="lxc_backends"}) > 3) and on() (min(up{job="lxc_backends"}) == 1)
                  for: 20s
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "backend"

                - alert: FrontendPoolLowCPU
                  expr: ((100 * sum(rate(meowcloud_lxc_cpu_usage_seconds_total{job="lxc_frontends"}[1m])) / sum(meowcloud_lxc_cpu_capacity_cores{job="lxc_frontends"})) < 20) and on() (count(up{job="lxc_frontends"}) > 3) and on() (min(up{job="lxc_frontends"}) == 1)
                  for: 20s
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "frontend"
          {% endraw %}
      notify: Reload Prometheus

    - name: Generate dynamic prometheus.yml scraping all MeowCloud tiers and linking Alertmanager
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        backup: true
        validate: 'promtool check config %s'
        content: |
          global:
            scrape_interval: 5s
            evaluation_interval: 5s
          rule_files:
            - /etc/prometheus/alert.rules.yml
          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - 'localhost:9093'
          scrape_configs:
            - job_name: 'observer'
              static_configs:
                - targets: ['localhost:9100']
            - job_name: 'tunnels'
              static_configs:
                - targets:
          {% for host in groups['tunnels'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'loadbalancers'
              static_configs:
                - targets:
          {% for host in groups['loadbalancers'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'backends'
              static_configs:
                - targets:
          {% for host in groups['backends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'frontends'
              static_configs:
                - targets:
          {% for host in groups['frontends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            # Separate cgroup CPU metrics: do not use node_cpu_seconds_total for LXC autoscaling.
            - job_name: 'lxc_backends'
              static_configs:
                - targets:
          {% for host in groups['backends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9101'
          {% endfor %}
            - job_name: 'lxc_frontends'
              static_configs:
                - targets:
          {% for host in groups['frontends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9101'
          {% endfor %}
            - job_name: 'databases'
              static_configs:
                - targets:
          {% for host in groups['databases'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
      notify: Reload Prometheus

    - name: Configure Alertmanager to route Auto-Scale Webhooks to Auto-VM (192.168.150.20:5000)
      ansible.builtin.copy:
        dest: /etc/prometheus/alertmanager.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            resolve_timeout: 5m
          route:
            group_by: ['autoscale', 'scale_action']
            group_wait: 25s
            group_interval: 30s
            repeat_interval: 60s
            receiver: 'default-noop'
            routes:
              - match:
                  autoscale: "true"
                receiver: 'meowcloud-autoscale-webhook'
          receivers:
            - name: 'default-noop'
            - name: 'meowcloud-autoscale-webhook'
              webhook_configs:
                - url: 'http://192.168.150.20:5000/webhook'
                  send_resolved: false
      notify: Restart Alertmanager

    - name: Ensure Prometheus, Alertmanager and Node Exporter are active
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - prometheus
        - prometheus-alertmanager
        - prometheus-node-exporter

    - name: Flush handlers to apply Prometheus and Alertmanager changes immediately
      ansible.builtin.meta: flush_handlers

    - name: Detect an existing DB06 etcd voter on Observer
      ansible.builtin.stat:
        path: /var/lib/meowcloud-etcd/.meowcloud-db06-owned
      register: observer_etcd_marker

    - name: Verify Observer etcd service before installing Grafana
      ansible.builtin.command:
        argv: [systemctl, is-active, meowcloud-etcd]
      changed_when: false
      when: observer_etcd_marker.stat.isreg | default(false)

    - name: Verify three-voter consensus before installing Grafana
      ansible.builtin.command:
        argv:
          - /usr/bin/etcdctl
          - --endpoints=https://192.168.150.71:2379,https://192.168.150.72:2379,https://192.168.150.21:2379
          - --cacert=/etc/meowcloud/tls/ca.pem
          - --cert=/etc/meowcloud/tls/etcd-server.pem
          - --key=/etc/meowcloud/tls/etcd-server-key.pem
          - endpoint
          - health
      environment:
        ETCDCTL_API: "3"
      changed_when: false
      when: observer_etcd_marker.stat.isreg | default(false)

    - name: Install Grafana without changing the etcd service
      block:
        - name: Copy versioned Grafana installer and dashboard
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../monitoring/grafana/"
            dest: /opt/meowcloud-grafana-config/
            owner: root
            group: root
            mode: "0644"
            directory_mode: "0755"

        - name: Install or reconcile the resource-limited Grafana service
          ansible.builtin.command:
            argv: [bash, /opt/meowcloud-grafana-config/install.sh]
          register: grafana_install
          changed_when: "'changed=true' in grafana_install.stdout"

        # The installer can leave an older systemd drop-in in place, even when the
        # packaged unit now says 0.0.0.0. Enforce the effective runtime setting.
        - name: Create Grafana systemd override directory
          ansible.builtin.file:
            path: /etc/systemd/system/meowcloud-grafana.service.d
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Force Grafana to listen on Observer network interfaces
          ansible.builtin.copy:
            dest: /etc/systemd/system/meowcloud-grafana.service.d/99-meowcloud-http-listen.conf
            owner: root
            group: root
            mode: '0644'
            content: |
              [Service]
              Environment="GF_SERVER_HTTP_ADDR=0.0.0.0"

        - name: Reload systemd and restart Grafana with the enforced listener
          ansible.builtin.systemd_service:
            name: meowcloud-grafana
            daemon_reload: true
            enabled: true
            state: restarted

        - name: Verify Grafana API on Observer service IP, not just localhost
          ansible.builtin.uri:
            url: "http://{{ ansible_host | default('192.168.150.21') }}:3000/api/health"
            status_code: 200
            return_content: true
            use_proxy: false
          register: grafana_network_health
          retries: 12
          delay: 2
          until: >-
            (grafana_network_health.status | default(0)) == 200 and
            (grafana_network_health.json.database | default('')) == 'ok'
          changed_when: false

        - name: Verify CT120 can reach Grafana TCP 3000 on Observer
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default('192.168.150.21') }}"
            port: 3000
            state: started
            connect_timeout: 3
            timeout: 15
          delegate_to: localhost
          become: false
          changed_when: false

      always:
        - name: Recheck three-voter consensus after the Grafana attempt
          ansible.builtin.command:
            argv:
              - /usr/bin/etcdctl
              - --endpoints=https://192.168.150.71:2379,https://192.168.150.72:2379,https://192.168.150.21:2379
              - --cacert=/etc/meowcloud/tls/ca.pem
              - --cert=/etc/meowcloud/tls/etcd-server.pem
              - --key=/etc/meowcloud/tls/etcd-server-key.pem
              - endpoint
              - health
          environment:
            ETCDCTL_API: "3"
          changed_when: false
          when: observer_etcd_marker.stat.isreg | default(false)

  handlers:
    - name: Reload Prometheus
      ansible.builtin.service:
        name: prometheus
        state: reloaded
    - name: Restart Alertmanager
      ansible.builtin.service:
        name: prometheus-alertmanager
        state: restarted
