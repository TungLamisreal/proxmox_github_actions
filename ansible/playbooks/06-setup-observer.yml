---
- name: Configure Observer (Prometheus, Alertmanager & Auto-Scale Alerting)
  hosts: monitoring
  become: true
  gather_facts: false
  tasks:
    - name: Install Prometheus and Alertmanager
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-alertmanager
        state: present
        update_cache: true
        cache_valid_time: 86400
        update_cache_retries: 5
        update_cache_retry_max_delay: 12
        lock_timeout: 300

    - name: Generate Prometheus Alert Rules for Scale-Out and Scale-In (Cgroup Quota Fix)
      ansible.builtin.copy:
        dest: /etc/prometheus/alert.rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          {% raw %}
          groups:
            - name: meowcloud_autoscale_rules
              interval: 10s
              rules:
                # --- BE có 2 Cores: Lấy tổng CPU thực dùng chia 2 ---
                - alert: BackendPoolHighCPU
                  expr: (sum by (instance) (rate(node_cpu_seconds_total{job="backends",mode!="idle"}[1m])) / 2) * 100 > 80
                  for: 30s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "backend"

                # --- FE có 1 Core: Lấy tổng CPU thực dùng chia 1 ---
                - alert: FrontendPoolHighCPU
                  expr: (sum by (instance) (rate(node_cpu_seconds_total{job="frontends",mode!="idle"}[1m])) / 1) * 100 > 80
                  for: 30s
                  labels:
                    severity: critical
                    autoscale: "true"
                    scale_action: "scale_out"
                    scale_target: "frontend"

                # --- Scale-in BE: Tổng tải chia cho (Số máy * 2 nhân) ---
                - alert: BackendPoolLowCPU
                  expr: ((sum by (job) (rate(node_cpu_seconds_total{job="backends",mode!="idle"}[1m])) / (count by (job) (up{job="backends"}) * 2)) * 100 < 20) and (count by (job) (up{job="backends"}) > 3)
                  for: 30s
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "backend"

                # --- Scale-in FE: Tổng tải chia cho (Số máy * 1 nhân) ---
                - alert: FrontendPoolLowCPU
                  expr: ((sum by (job) (rate(node_cpu_seconds_total{job="frontends",mode!="idle"}[1m])) / (count by (job) (up{job="frontends"}) * 1)) * 100 < 20) and (count by (job) (up{job="frontends"}) > 3)
                  for: 30s
                  labels:
                    severity: info
                    autoscale: "true"
                    scale_action: "scale_in"
                    scale_target: "frontend"
          {% endraw %}
      notify: Restart Prometheus

    - name: Generate dynamic prometheus.yml scraping all MeowCloud tiers and linking Alertmanager
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            scrape_interval: 10s
            evaluation_interval: 10s
          rule_files:
            - /etc/prometheus/alert.rules.yml
          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - 'localhost:9093'
          scrape_configs:
            - job_name: 'observer'
              static_configs:
                - targets: ['localhost:9100']
            - job_name: 'tunnels'
              static_configs:
                - targets:
          {% for host in groups['tunnels'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'loadbalancers'
              static_configs:
                - targets:
          {% for host in groups['loadbalancers'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'backends'
              static_configs:
                - targets:
          {% for host in groups['backends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'frontends'
              static_configs:
                - targets:
          {% for host in groups['frontends'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
            - job_name: 'databases'
              static_configs:
                - targets:
          {% for host in groups['databases'] %}
                    - '{{ hostvars[host]["ansible_host"] }}:9100'
          {% endfor %}
      notify: Reload Prometheus

    - name: Configure Alertmanager to route Auto-Scale Webhooks to Auto-VM (192.168.150.20:5000)
      ansible.builtin.copy:
        dest: /etc/prometheus/alertmanager.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        content: |
          global:
            resolve_timeout: 5m
          route:
            group_by: ['alertname', 'scale_target', 'scale_action']
            group_wait: 10s
            group_interval: 1m
            repeat_interval: 5m
            receiver: 'default-noop'
            routes:
              - match:
                  autoscale: "true"
                receiver: 'meowcloud-autoscale-webhook'
          receivers:
            - name: 'default-noop'
            - name: 'meowcloud-autoscale-webhook'
              webhook_configs:
                - url: 'http://192.168.150.20:5000/webhook'
                  send_resolved: false
      notify: Restart Alertmanager

    - name: Ensure Prometheus, Alertmanager and Node Exporter are active
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - prometheus
        - prometheus-alertmanager
        - prometheus-node-exporter

    - name: Flush handlers to apply Prometheus and Alertmanager changes immediately
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload Prometheus
      ansible.builtin.service:
        name: prometheus
        state: reloaded
    - name: Restart Alertmanager
      ansible.builtin.service:
        name: prometheus-alertmanager
        state: restarted
