name: "00 - Validate MeowCloud IaC & PVE HA Policy (PR only)"

on:
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/playbooks/01-setup-tunnels.yml"
      - "ansible/inventory.ini"
      - "scripts/scale_in_node.py"
      - "tests/test_network_gateway.py"
      - "scripts/pve_cluster_policy.py"
      - "scripts/destroy_db_rbd_recovery.py"
      - "tests/test_destroy_db_rbd_recovery.py"
      - "tests/test_pve_cluster_policy.py"
      - ".github/workflows/01-provision-infra.yml"
      - ".github/workflows/02-destroy-infra.yml"
      - ".github/workflows/04-autoscale-in.yml"
      - "tests/test_scale_in_provider_lock.py"
      - ".github/workflows/00-validate-iac-pr.yml"
      - ".github/workflows/00-build-golden-images.yml"
      - ".github/workflows/00-resume-db.yml"
      - "packer/**"
      - "tests/test_packer_golden_build.py"
      - "tests/test_db_bootstrap_readiness.py"
      - "tests/test_db07_patroni_preflight.py"
      - "scripts/db07_patroni_preflight.py"
      - "scripts/bootstrap_meowcrud.py"
      - "ansible/playbooks/05-setup-database.yml"
      - "ansible/playbooks/06-setup-observer.yml"
      - "tests/test_alert_batching.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: "Terraform schema + offline HA safety tests (no PVE access)"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform syntax and provider schema
        shell: bash
        run: |
          set -euo pipefail
          cd terraform
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Packer cleanup shell syntax (offline)
        shell: bash
        run: |
          set -euo pipefail
          for script in packer/scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -p "test_packer_golden_build.py" -v
          python3 -m unittest discover -s tests -p "test_db_bootstrap_readiness.py" -v
          python3 -m unittest discover -s tests -p "test_db07_patroni_preflight.py" -v
          python3 -m unittest discover -s tests -p "test_scale_in_provider_lock.py" -v
          python3 -m unittest discover -s tests -p "test_alert_batching.py" -v
          python3 -m unittest discover -s tests -p "test_network_gateway.py" -v

      - name: PVE HA/startup script unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pve_cluster_policy.py
          python3 -m unittest discover -s tests -p 'test_pve_cluster_policy.py' -v
          python3 -m py_compile scripts/destroy_db_rbd_recovery.py
          python3 -m unittest discover -s tests -p 'test_destroy_db_rbd_recovery.py' -v
