name: "01 - Day-0 Infrastructure Provisioning"

on:
  workflow_dispatch:

concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

env:
  TF_VAR_proxmox_api_url: "https://192.168.150.49:8006/api2/json"
  TF_VAR_proxmox_api_token_id: "root@pam!iac-token"
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
  ANSIBLE_CONFIG: "/opt/meowcloud-iac/ansible/ansible.cfg"

jobs:
  provision:
    name: "Terraform Apply & Ansible Config"
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Step 1 - Terraform Init & Apply (Cấp phát tài nguyên)
        working-directory: /opt/meowcloud-iac/terraform
        run: |
          terraform init -input=false
          terraform apply \
            -state=/opt/meowcloud-iac/state/terraform.tfstate \
            -var-file=/opt/meowcloud-iac/state/autoscale.tfvars.json \
            -auto-approve

      - name: Step 2 - Wait for Cloud-Init and SSH to be ready (Chờ khởi động)
        run: |
          echo "[*] Đang chờ hệ điều hành các máy ảo boot và khởi tạo SSH..."
          sleep 45

      - name: Step 3 - Ansible Master Provisioning (Cấu hình Dịch vụ & Giám sát)
        working-directory: /opt/meowcloud-iac/ansible
        run: |
          echo "[*] Bắt đầu cấu hình tự động toàn bộ cụm (Tunnels, LB, DB, BE, FE, Observer)..."
          ansible-playbook -i inventory.ini playbooks/site.yml

      - name: Step 4 - Verify System Readiness
        run: |
          echo "[*] Kiểm tra trạng thái Load Balancer..."
          curl -fsS http://192.168.150.100/lb-status
          echo "\n[OK] Hệ thống đã sẵn sàng 100%!"
