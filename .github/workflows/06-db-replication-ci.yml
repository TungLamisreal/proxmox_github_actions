name: "DB Replication PR Safety Checks"
on:
  pull_request:
    paths:
      - "ansible/playbooks/09-backup-db-before-replication.yml"
      - "ansible/playbooks/10-audit-db-replication.yml"
      - "ansible/playbooks/11-configure-db-primary-replication.yml"
      - "ansible/playbooks/12-bootstrap-db-standby.yml"
      - "ansible/group_vars/databases/replication.yml"
      - "tests/test_db_replication_guardrails.py"
      - "tests/test_db06_detect.py"
      - "scripts/db06_detect.py"
      - "scripts/db06_secret_vars.py"
      - "ansible/playbooks/13-audit-patroni-readiness.yml"
      - "ansible/playbooks/14-stage-patroni-config.yml"
      - "ansible/playbooks/15-bootstrap-etcd-quorum.yml"
      - "ansible/playbooks/16-verify-etcd-quorum.yml"
      - "ansible/playbooks/17-diagnose-etcd.yml"
      - "ansible/templates/meowcloud-etcd.yml.j2"
      - "ansible/templates/meowcloud-etcd.service.j2"
      - "scripts/db06_etcd_pki.py"
      - "scripts/db06_pve_placement.py"
      - "tests/test_db06_etcd.py"
      - "scripts/db07_patroni_preflight.py"
      - "tests/test_db07_patroni_preflight.py"
      - "tests/test_db08_patroni_takeover.py"
      - "ansible/tasks/db07-activate-one.yml"
      - "ansible/playbooks/18-prepare-patroni-lab.yml"
      - "ansible/playbooks/19-takeover-patroni-lab.yml"
      - "ansible/playbooks/20-verify-patroni-lab.yml"
      - "ansible/playbooks/21-configure-db-writer-proxy.yml"
      - "ansible/templates/haproxy-db-standalone.cfg.j2"
      - "ansible/playbooks/05-setup-database.yml"
      - ".github/workflows/07-db-patroni-lab.yml"
      - "docs/10-patroni-lab-takeover-runbook.md"
      - "docker/db-patroni/Dockerfile"
      - "docs/09-patroni-handover-preflight.md"
      - "docs/08-etcd-dcs-runbook.md"
      - "ansible/templates/patroni.yml.j2"
      - "ansible/templates/haproxy-db.cfg.j2"
      - "docs/07-patroni-ha-design.md"
      - ".github/workflows/06-db-streaming-replication.yml"
      - ".github/workflows/06-db-replication-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated YAML and Ansible syntax validators
        run: python3 -m pip install --disable-pip-version-check pyyaml "ansible-core==2.21.5"
      - name: Parse Ansible and workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          paths = [
              "ansible/playbooks/09-backup-db-before-replication.yml",
              "ansible/playbooks/10-audit-db-replication.yml",
              "ansible/playbooks/11-configure-db-primary-replication.yml",
              "ansible/playbooks/12-bootstrap-db-standby.yml",
              "ansible/playbooks/13-audit-patroni-readiness.yml",
              "ansible/playbooks/14-stage-patroni-config.yml",
              "ansible/playbooks/15-bootstrap-etcd-quorum.yml",
              "ansible/playbooks/16-verify-etcd-quorum.yml",
              "ansible/playbooks/17-diagnose-etcd.yml",
              "ansible/playbooks/18-prepare-patroni-lab.yml",
              "ansible/playbooks/19-takeover-patroni-lab.yml",
              "ansible/playbooks/20-verify-patroni-lab.yml",
              "ansible/playbooks/21-configure-db-writer-proxy.yml",
              "ansible/tasks/db07-activate-one.yml",
              ".github/workflows/07-db-patroni-lab.yml",
              "ansible/group_vars/databases/replication.yml",
              ".github/workflows/06-db-streaming-replication.yml",
              ".github/workflows/06-db-replication-ci.yml",
          ]
          for p in paths:
              data = yaml.safe_load(Path(p).read_text())
              if not isinstance(data, (list, dict)):
                  raise SystemExit(f"Invalid YAML root: {p}")
              print(f"OK: {p}")
          PY
      - name: Validate DCS Ansible task/module syntax before merging
        run: |
          for playbook in 15-bootstrap-etcd-quorum 16-verify-etcd-quorum 17-diagnose-etcd 18-prepare-patroni-lab 19-takeover-patroni-lab 20-verify-patroni-lab 21-configure-db-writer-proxy; do
            ansible-playbook --syntax-check -i ansible/inventory.ini "ansible/playbooks/$playbook.yml"
          done
      - name: Run DB replication safety contract unit tests
        run: |
          python3 -m unittest discover -s tests -p test_db_replication_guardrails.py -v
          python3 -m unittest discover -s tests -p test_db06_detect.py -v
          python3 -m unittest discover -s tests -p test_db06_etcd.py -v
          python3 -m unittest discover -s tests -p test_db07_patroni_preflight.py -v
          python3 -m unittest discover -s tests -p test_db08_patroni_takeover.py -v
          python3 -m py_compile scripts/db06_detect.py scripts/db06_secret_vars.py scripts/db06_etcd_pki.py scripts/db06_pve_placement.py scripts/db07_patroni_preflight.py

      - name: Build Patroni + PostgreSQL 15 compatibility image (no deployment)
        run: |
          set -euo pipefail
          docker build --file docker/db-patroni/Dockerfile --tag meowcloud-patroni-ci:pg15 .
          docker run --rm --entrypoint /bin/sh meowcloud-patroni-ci:pg15 -ec '
            test "$(id -u)" = "70"
            /opt/patroni-venv/bin/patroni --version
            /usr/local/bin/postgres --version | grep -E "PostgreSQL.*15[.]"
            /usr/local/bin/pg_rewind --version | grep -E "pg_rewind.*15[.]"
            /opt/patroni-venv/bin/python3 -c "import patroni, psycopg2; print(\"PASS: Patroni and psycopg2 importable\")"
          '
      - name: Smoke-test real Docker inspect Go template against a disposable container
        run: |
          set -euo pipefail
          name="db07-inspect-ci-${GITHUB_RUN_ID}"
          docker create --name "$name" --restart=always \
            -v /tmp:/var/lib/postgresql/data postgres:15-alpine >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          python3 - "$name" <<'PY'
          import subprocess
          import sys
          from scripts.db07_patroni_preflight import DOCKER_FMT, parse_container
          inspection = subprocess.run(
              ["docker", "inspect", "--format", DOCKER_FMT, sys.argv[1]],
              text=True, capture_output=True, check=True
          )
          data = parse_container(inspection.stdout.strip())
          assert data["restart_policy"] == "always", data
          assert data["mounts"].get("/tmp") == "/var/lib/postgresql/data", data
          assert data["running"] is False, data
          print("PASS: Docker inspection command and parser match real Docker output")
          PY



