name: "06 - Database HA (Replication, etcd, Patroni, Writer VIP)"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "After 01 run bootstrap-ha once; use health/diagnose on adopted cluster"
        type: choice
        options: [bootstrap-ha, health, diagnose, adopt-vip, gateway-repair, resume]
        default: health
        required: true
      confirmation:
        description: "bootstrap: BOOTSTRAP_MEOWCLOUD_DB_HA; adopt: ACTIVATE_DB_WRITER_VIP; repair: ENABLE_ETCD_HTTP_GATEWAY; resume: RESUME_PATRONI_LAB"
        type: string
        default: ""
        required: false
permissions:
  contents: read
concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

# Only bootstrap-ha modifies standalone PostgreSQL PGDATA ownership.
# All other modes are either read-only or explicitly acknowledged maintenance.
jobs:
  preflight:
    name: "01 • One-time standalone PostgreSQL replication preflight"
    if: ${{ inputs.mode == 'bootstrap-ha' }}
    runs-on: self-hosted
    timeout-minutes: 12
    outputs:
      bootstrap_required: ${{ steps.detect.outputs.bootstrap_required }}
      backup_reference: ${{ steps.detect.outputs.backup_reference }}
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Require approved two-DB topology without existing Patroni owner
        run: |
          set -euo pipefail
          test "$CONFIRM" = "BOOTSTRAP_MEOWCLOUD_DB_HA"
          test -s "$INVENTORY"
          test -s /home/github-runner/.vault_pass
          test -s /home/github-runner/.ssh/id_ed25519
          python3 scripts/db07_patroni_preflight.py --inventory "$INVENTORY" --validate-inventory-only
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/24-guard-patroni-reentry.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/10-audit-db-replication.yml
      - name: Detect whether standalone DB02 physical replica needs initial seed
        id: detect
        run: |
          set -euo pipefail
          python3 scripts/db06_detect.py --mode "$MODE" --confirmation "$CONFIRM" --inventory "$INVENTORY" --output "$GITHUB_OUTPUT" --backup-reference "lab-db06-$GITHUB_RUN_ID"

  backup:
    name: "02 • Preserve existing standalone DB01 SQL"
    needs: preflight
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/09-backup-db-before-replication.yml -e pg_allow_backup=true -e "pg_backup_reference=$BACKUP_REF"

  primary:
    name: "03 • Set up WAL sender on standalone DB01"
    needs: [preflight, backup]
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' && needs.backup.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          vars="$(mktemp)"
          chmod 0600 "$vars"
          trap 'rm -f "$vars"' EXIT
          python3 scripts/db06_secret_vars.py "$vars"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/11-configure-db-primary-replication.yml -e "@$vars" -e pg_apply_primary_replication=true -e "pg_backup_reference=$BACKUP_REF"

  standby:
    name: "04 • Bootstrap DB02 physical streaming replica once"
    needs: [preflight, primary]
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' && needs.primary.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          vars="$(mktemp)"
          chmod 0600 "$vars"
          trap 'rm -f "$vars"' EXIT
          python3 scripts/db06_secret_vars.py "$vars"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/12-bootstrap-db-standby.yml -e "@$vars" -e pg_bootstrap_standby=true -e "pg_backup_reference=$BACKUP_REF"

  verify:
    name: "05 • Gate same physical lineage and streaming DB02"
    needs: [preflight, backup, primary, standby]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.preflight.outputs.bootstrap_required == 'false' || needs.standby.result == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/10-audit-db-replication.yml -e pg_expect_replication_ready=true

  etcd-bootstrap:
    name: "06 • Install 3-voter mTLS etcd (DB01, DB02, Observer)"
    needs: verify
    if: ${{ needs.verify.result == 'success' && inputs.mode == 'bootstrap-ha' }}
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      MEOW_ETCD_PKI: /home/github-runner/.local/state/meowcloud/db-ha-etcd-pki
    steps:
      - uses: actions/checkout@v4
      - name: Require distinct Proxmox failure domains and available dependencies
        run: |
          set -euo pipefail
          python3 scripts/db06_pve_placement.py
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/13-audit-patroni-readiness.yml
          python3 scripts/db06_etcd_pki.py --directory "$MEOW_ETCD_PKI"
      - name: Install etcd with protected TLS without touching PGDATA
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/15-bootstrap-etcd-quorum.yml -e db_enable_etcd=true

  etcd-verify:
    name: "07 • Verify 3/3 etcd gRPC and Patroni HTTPS /v3 gateway"
    needs: etcd-bootstrap
    if: ${{ needs.etcd-bootstrap.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/16-verify-etcd-quorum.yml

  prepare:
    name: "08 • Build/stage Patroni PostgreSQL 15 image and private TLS"
    needs: etcd-verify
    if: ${{ inputs.mode == 'bootstrap-ha' && needs.etcd-verify.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact commit image and import on both DB hosts (no PGDATA mount)
        run: |
          set -euo pipefail
          image="meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"
          docker build --file docker/db-patroni/Dockerfile --tag "$image" .
          # DB01/DB02 are recreated from golden VMs on 02 -> 01. Their SSH host
          # keys rotate, while the self-hosted runner's global known_hosts is
          # persistent. Use an isolated trust-on-first-use file for this job,
          # without altering the runner's global SSH trust store.
          transfer_known_hosts="$(mktemp)"
          chmod 0600 "$transfer_known_hosts"
          trap 'rm -f "$transfer_known_hosts"' EXIT
          for ip in 192.168.150.71 192.168.150.72; do
            docker save "$image" | ssh -T -i /home/github-runner/.ssh/id_ed25519 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              -o "UserKnownHostsFile=$transfer_known_hosts" \
              "root@$ip" docker load
          done
      - name: Stage Patroni config without restarting legacy PostgreSQL
        run: |
          set -euo pipefail
          vars="$(mktemp)"
          chmod 0600 "$vars"
          trap 'rm -f "$vars"' EXIT
          python3 scripts/db06_secret_vars.py "$vars"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/18-prepare-patroni-lab.yml -e "@$vars" -e pg_prepare_patroni=true -e "patroni_image=meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"

  takeover:
    name: "09 • Exclusive PGDATA takeover: DB01 then DB02 (never repeat)"
    needs: prepare
    if: ${{ inputs.mode == 'bootstrap-ha' && needs.prepare.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Adopt existing PGDATA; old Docker restart disabled before stopping
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/19-takeover-patroni-lab.yml -e pg_takeover_approved=true -e "patroni_image=meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"
      - name: Diagnose Patroni without rollback on takeover failure
        if: ${{ failure() }}
        run: python3 scripts/db07_patroni_diagnose.py

  gate:
    name: "10 • Read-only existing HA DCS check"
    if: ${{ inputs.mode == 'health' || inputs.mode == 'adopt-vip' || inputs.mode == 'resume' }}
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          case "$MODE" in
            health) test -z "$CONFIRM" ;;
            adopt-vip) test "$CONFIRM" = "ACTIVATE_DB_WRITER_VIP" ;;
            resume) test "$CONFIRM" = "RESUME_PATRONI_LAB" ;;
            *) exit 1 ;;
          esac
          test -s "$INVENTORY"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/16-verify-etcd-quorum.yml

  health:
    name: "11 • Patroni SQL/REST roles, one writer and streaming replica"
    needs: [takeover, gate]
    if: ${{ always() && ((inputs.mode == 'bootstrap-ha' && needs.takeover.result == 'success') || ((inputs.mode == 'health' || inputs.mode == 'adopt-vip') && needs.gate.result == 'success')) }}
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/20-verify-patroni-lab.yml

  hba:
    name: "12 • Read-only physical replication loopback HBA verification"
    needs: health
    if: ${{ needs.health.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/25-verify-patroni-local-hba.yml

  proxy:
    name: "13 • Install HAProxy PostgreSQL writer port 5432 on both LBs"
    needs: [takeover, hba]
    if: ${{ inputs.mode == 'bootstrap-ha' && needs.takeover.result == 'success' && needs.hba.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/21-configure-db-writer-proxy.yml -e pg_enable_writer_proxy=true

  writer-smoke:
    name: "14 • Prove writer VIP port 5432 from Backend01"
    needs: [health, hba, proxy]
    if: ${{ always() && needs.hba.result == 'success' && ((inputs.mode == 'bootstrap-ha' && needs.proxy.result == 'success') || inputs.mode == 'health' || inputs.mode == 'adopt-vip') }}
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible -i "$INVENTORY" backend-01 -m ansible.builtin.wait_for -a "host=192.168.150.100 port=5432 timeout=12"

  activate-vip:
    name: "15 • Atomically switch CRUD state to VIP and reconcile Backend env"
    needs: [writer-smoke, preflight, gate]
    if: ${{ always() && needs.writer-smoke.result == 'success' && ((inputs.mode == 'bootstrap-ha' && needs.preflight.result == 'success') || (inputs.mode == 'adopt-vip' && needs.gate.result == 'success')) }}
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Commit source-of-truth only after healthy Patroni and VIP
        run: |
          set -euo pipefail
          python3 scripts/db_ha_vip.py --activate --confirm ACTIVATE_DB_WRITER_VIP
          python3 scripts/db_ha_vip.py --check
      - name: Rolling reconcile Backend containers to DB_HOST .100
        run: |
          set -euo pipefail
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/03-setup-backend.yml -e meow_rolling_batch_size=1

  final-smoke:
    name: "16 • Check every Backend VIP mapping and optional SQL smoke"
    needs: activate-vip
    if: ${{ needs.activate-vip.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/db_ha_vip.py --check
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/26-verify-backend-db-writer.yml

  diagnose:
    name: "00 • Manual read-only Patroni failure diagnostics (no etcd prerequisite)"
    if: ${{ inputs.mode == 'diagnose' }}
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      HOME: /home/github-runner
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 scripts/db07_patroni_diagnose.py

  gateway-repair:
    name: "R1 • Explicit rolling etcd HTTP /v3 gateway repair"
    if: ${{ inputs.mode == 'gateway-repair' }}
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          test "$CONFIRM" = "ENABLE_ETCD_HTTP_GATEWAY"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/22-enable-etcd-gateway.yml -e db07_gateway_repair_approved=true
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/16-verify-etcd-quorum.yml

  resume:
    name: "R2 • Explicit one-time interrupted takeover continuation"
    needs: gate
    if: ${{ inputs.mode == 'resume' && needs.gate.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/23-resume-patroni-lab.yml -e pg_resume_takeover_approved=true
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/20-verify-patroni-lab.yml

  failure-diagnostic:
    name: "99 • Read-only failure capture; never resets etcd or Patroni"
    needs: [preflight, backup, primary, standby, verify, etcd-bootstrap, etcd-verify, prepare, takeover, gate, health, hba, proxy, writer-smoke, activate-vip, final-smoke, gateway-repair, resume]
    if: ${{ always() && inputs.mode != 'diagnose' && contains(needs.*.result, 'failure') }}
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      HOME: /home/github-runner
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/db07_patroni_diagnose.py
