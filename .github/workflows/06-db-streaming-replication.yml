name: "06 - Database HA Pipeline (Staged, Rerunnable)"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PostgreSQL replication, DCS quorum or Patroni staging (no takeover)"
        type: choice
        options: [full, verify, ha-readiness, dcs-bootstrap, dcs-health, patroni-stage]
        default: full
        required: true
      confirmation:
        description: "New replica: APPLY_DB_REPLICATION; etcd: BOOTSTRAP_ETCD_QUORUM; config: STAGE_PATRONI_CONFIG_ONLY"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: meowcloud-db06
  cancel-in-progress: false

# Each job checks out the same commit, uses the existing CT120 runtime inventory,
# and carries its own prerequisites. GitHub > Re-run failed jobs replays only
# the failed jobs and their required dependent jobs; successful jobs are retained.
jobs:
  preflight:
    name: "01 • Preflight & detect live topology"
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      bootstrap_required: ${{ steps.detect.outputs.bootstrap_required }}
      backup_reference: ${{ steps.detect.outputs.backup_reference }}
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Validate checked-out playbooks and target inventory
        run: |
          set -euo pipefail
          test -s "$INVENTORY"
          test -s /home/github-runner/.ssh/id_ed25519
          test -s /home/github-runner/.vault_pass
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/09-backup-db-before-replication.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/10-audit-db-replication.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/11-configure-db-primary-replication.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/12-bootstrap-db-standby.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/13-audit-patroni-readiness.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/14-stage-patroni-config.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/15-bootstrap-etcd-quorum.yml
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" ansible/playbooks/16-verify-etcd-quorum.yml

      - name: Detect DB roles without changing either database
        id: detect
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirmation }}
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" ansible/playbooks/10-audit-db-replication.yml
          python3 scripts/db06_detect.py --mode "$MODE" --confirmation "$CONFIRM" \
            --inventory "$INVENTORY" --output "$GITHUB_OUTPUT" \
            --backup-reference "lab-db06-$RUN_NUMBER"

  backup:
    name: "02 • Preserve DB01 data"
    needs: preflight
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
    steps:
      - uses: actions/checkout@v4
      - name: Save idempotent SQL backup
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/09-backup-db-before-replication.yml \
            -e pg_allow_backup=true -e "pg_backup_reference=$BACKUP_REF"

  primary:
    name: "03 • Prepare DB01 replication source"
    needs: [preflight, backup]
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' && needs.backup.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure guarded WAL and source authentication
        run: |
          set -euo pipefail
          export VARS_FILE="$(mktemp)"
          chmod 0600 "$VARS_FILE"
          trap 'rm -f "$VARS_FILE"' EXIT
          python3 scripts/db06_secret_vars.py "$VARS_FILE"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/11-configure-db-primary-replication.yml \
            -e "@$VARS_FILE" -e pg_apply_primary_replication=true \
            -e "pg_backup_reference=$BACKUP_REF"

  standby:
    name: "04 • Stage and activate DB02 replica"
    needs: [preflight, primary]
    if: ${{ needs.preflight.outputs.bootstrap_required == 'true' && needs.primary.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      BACKUP_REF: ${{ needs.preflight.outputs.backup_reference }}
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap only if DB02 is not already streaming
        run: |
          set -euo pipefail
          export VARS_FILE="$(mktemp)"
          chmod 0600 "$VARS_FILE"
          trap 'rm -f "$VARS_FILE"' EXIT
          python3 scripts/db06_secret_vars.py "$VARS_FILE"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/12-bootstrap-db-standby.yml \
            -e "@$VARS_FILE" -e pg_bootstrap_standby=true \
            -e "pg_backup_reference=$BACKUP_REF"

  verify:
    name: "05 • Verify streaming and physical lineage"
    needs: [preflight, backup, primary, standby]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.preflight.outputs.bootstrap_required == 'false' || needs.standby.result == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Require one primary, one streaming replica and shared system ID
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/10-audit-db-replication.yml \
            -e pg_expect_replication_ready=true

  patroni-readiness:
    name: "06 • Patroni / quorum / fencing read-only readiness"
    needs: [preflight, verify]
    if: ${{ always() && needs.verify.result == 'success' && (inputs.mode == 'ha-readiness' || inputs.mode == 'patroni-stage') }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Audit DCS fault domains and conflicting lifecycle controllers
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/13-audit-patroni-readiness.yml


  patroni-stage:
    name: "07 • Stage Patroni config only (no takeover)"
    needs: [preflight, patroni-readiness, etcd-verify]
    if: ${{ always() && needs.patroni-readiness.result == 'success' && needs.etcd-verify.result == 'success' && inputs.mode == 'patroni-stage' }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit configuration-only approval and stage Patroni YAML
        run: |
          set -euo pipefail
          test "$CONFIRM" = "STAGE_PATRONI_CONFIG_ONLY"
          export VARS_FILE="$(mktemp)"
          chmod 0600 "$VARS_FILE"
          trap 'rm -f "$VARS_FILE"' EXIT
          python3 scripts/db06_secret_vars.py "$VARS_FILE"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/14-stage-patroni-config.yml \
            -e "@$VARS_FILE" -e pg_stage_patroni=true

  etcd-bootstrap:
    name: "08 • Provision three-member etcd DCS with mTLS"
    needs: [preflight, verify]
    if: ${{ always() && needs.verify.result == 'success' && inputs.mode == 'dcs-bootstrap' }}
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      MEOW_ETCD_PKI: /opt/meowcloud-iac/state/db-ha-etcd-pki
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm init-only action and distinct physical PVE fault domains
        run: |
          set -euo pipefail
          test "$CONFIRM" = "BOOTSTRAP_ETCD_QUORUM"
          python3 scripts/db06_pve_placement.py

      - name: Generate or validate persistent TLS certificates (no silent rotation)
        run: |
          set -euo pipefail
          python3 scripts/db06_etcd_pki.py --directory "$MEOW_ETCD_PKI"

      - name: Install and configure DB06-owned etcd service on DB01, DB02 and CT121
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/15-bootstrap-etcd-quorum.yml -e db_enable_etcd=true

  etcd-verify:
    name: "09 • Verify etcd 3/3 quorum via mTLS (read-only)"
    needs: [preflight, verify, etcd-bootstrap]
    if: ${{ always() && needs.verify.result == 'success' && (needs.etcd-bootstrap.result == 'success' || inputs.mode == 'dcs-health' || inputs.mode == 'patroni-stage') }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Check etcd membership and all HTTPS endpoints
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/16-verify-etcd-quorum.yml
