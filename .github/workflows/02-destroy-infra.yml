# ==============================================================================
# FILE: .github/workflows/02-destroy-infra.yml
# CHỨC NĂNG: Hủy diệt có kiểm soát các VM/CT thuộc phạm vi Lab (Bảo toàn Golden Images)
# ==============================================================================
name: "02 - Destroy MeowCloud Lab Infrastructure"

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Gõ chính xác 'DESTROY-MEOWCLOUD' để xác nhận xóa các VM/LXC của Lab:"
        required: true
        default: ""
        type: string
      tf_parallelism:
        description: "Số luồng xóa song song (Khuyên dùng: 1 hoặc 2 để tránh cfs-lock)"
        required: true
        default: "1"
        type: string

concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
  TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}

jobs:
  destroy-infrastructure:
    name: "Terraform Destroy Lab Workloads"
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Security Confirmation Gate"
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY-MEOWCLOUD" ]; then
            echo "ERROR: Chuỗi xác nhận không khớp! Bạn phải nhập chính xác: DESTROY-MEOWCLOUD"
            exit 1
          fi
          echo "Xác nhận hợp lệ. Bắt đầu quy trình thu hồi tài nguyên Lab..."

      - name: "3. Abort on locked workloads (never unlock a running backup/task)"
        run: |
          set -euo pipefail
          SSH_CMD="ssh -o StrictHostKeyChecking=no -i /home/github-runner/.ssh/id_ed25519 root@192.168.150.49"
          locked="$($SSH_CMD "grep -l '^lock:' /etc/pve/nodes/*/lxc/*.conf /etc/pve/nodes/*/qemu-server/*.conf 2>/dev/null || true")"
          if [ -n "$locked" ]; then
            echo "[STOP] Locked guest(s): $locked. Investigate backup/task before destroy."; exit 1
          fi

      - name: "4. Terraform Destroy"
        working-directory: ./terraform
        run: |
          PARALLEL="${{ github.event.inputs.tf_parallelism || '1' }}"
          terraform init -input=false
          terraform destroy -auto-approve -input=false -parallelism=${PARALLEL}

      - name: "5. Verify Golden Images Remain Intact"
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=no -i /home/github-runner/.ssh/id_ed25519 root@192.168.150.49"
          echo "=== Xác nhận 3 Golden Images vẫn được bảo toàn nguyên vẹn ==="
          $SSH_CMD "ls -lh /mnt/pve/shared-fs/template/cache/meowcloud-lxc-*.tar.zst"
          $SSH_CMD "qm list | grep -E '9001|9002|9003' || true"
