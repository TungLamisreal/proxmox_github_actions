name: "04 - Closed-Loop Auto-Scale In (Graceful Drain & Destroy)"

on:
  workflow_dispatch:
    inputs:
      allow_manual_test_without_alert:
        description: "Manual smoke test only: allow scale-in without firing LowCPU alert"
        required: false
        default: false
        type: boolean
      scale_target:
        description: "Phân hệ cần thu hồi (backend | frontend)"
        required: true
        default: "backend"
        type: choice
        options:
          - backend
          - frontend

concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  TF_VAR_proxmox_api_url: "https://192.168.150.49:8006/api2/json"
  TF_VAR_proxmox_api_token_id: "root@pam!iac-token"
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
  ANSIBLE_CONFIG: "/opt/meowcloud-iac/ansible/ansible.cfg"
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  scale_in:
    name: "Scale-In ${{ inputs.scale_target }} (LIFO + Graceful Drain)"
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Latest Code to /opt/meowcloud-iac (preserve runtime inventory/state)
        shell: bash
        run: |
          set -euo pipefail
          # The generated inventory on CT120 is authoritative after workflow 03.
          # Never overwrite it with the 3/3 baseline tracked in the Git repository.
          test -s /opt/meowcloud-iac/ansible/inventory.ini || {
            echo "::error::Missing runtime Ansible inventory. Do not scale-in."
            exit 1
          }
          for source in ansible/*; do
            [ "$(basename "$source")" = "inventory.ini" ] && continue
            cp -rf "$source" /opt/meowcloud-iac/ansible/
          done
          for source in terraform/*; do
            [ "$(basename "$source")" = "autoscale.auto.tfvars.json" ] && continue
            cp -rf "$source" /opt/meowcloud-iac/terraform/
          done
          # Scripts used by this workflow run directly from the checkout via GITHUB_WORKSPACE.
          # Never overwrite runtime monitoring tools (which may be owned by root).
          mkdir -p /opt/meowcloud-iac/packer/scripts
          cp -rf packer/scripts/* /opt/meowcloud-iac/packer/scripts/

      - name: Backup Elastic Pool State & Select LIFO Instance
        id: select_lifo
        working-directory: /opt/meowcloud-iac
        run: |
          set -euo pipefail
          umask 077
          # --- FRESHNESS CHECK ---
          echo "=== FRESHNESS CHECK: Kiểm tra tải thực tế trước khi xóa máy ==="
          FIRING_IN=$(curl -fsS "http://192.168.150.21:9090/api/v1/alerts" | jq '[.data.alerts[] | select(.labels.scale_action == "scale_in") | select(.state == "firing")] | length')
          if [ "$FIRING_IN" -eq 0 ] && [ "${{ inputs.allow_manual_test_without_alert }}" != "true" ]; then
            echo "skip_scale_in=true" >> "$GITHUB_OUTPUT"
            echo "Tải đã tăng vọt trở lại, không an toàn để thu hồi máy lúc này. Tự hủy đơn hàng Scale-in!"
            exit 0
          fi
          # --- KẾT THÚC FRESHNESS CHECK ---

          mkdir -p /opt/meowcloud-iac/state
          test -s /opt/meowcloud-iac/state/autoscale.tfvars.json || {
            echo "::error::Missing desired capacity state; refusing scale-in."
            exit 1
          }
          STATE_BACKUP="$RUNNER_TEMP/autoscale.tfvars.before-scale-in.json"
          INVENTORY_BACKUP="$RUNNER_TEMP/inventory.before-scale-in.ini"
          cp -p /opt/meowcloud-iac/state/autoscale.tfvars.json "$STATE_BACKUP"
          cp -p /opt/meowcloud-iac/ansible/inventory.ini "$INVENTORY_BACKUP"
          echo "STATE_BACKUP=$STATE_BACKUP" >> "$GITHUB_ENV"
          echo "INVENTORY_BACKUP=$INVENTORY_BACKUP" >> "$GITHUB_ENV"

          set +e
          META_JSON=$(python3 "$GITHUB_WORKSPACE/scripts/scale_in_node.py" --target "${{ inputs.scale_target }}")
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 3 ]; then
            echo "skip_scale_in=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi

          echo "skip_scale_in=false" >> $GITHUB_OUTPUT
          echo "retiring_vmid=$(echo "$META_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["retiring_vmid"])')" >> $GITHUB_OUTPUT
          echo "retiring_ip=$(echo "$META_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["retiring_ip"])')" >> $GITHUB_OUTPUT
          echo "retiring_host=$(echo "$META_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["retiring_host"])')" >> $GITHUB_OUTPUT
          echo "retiring_port=$(echo "$META_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["retiring_port"])')" >> $GITHUB_OUTPUT

      - name: Step 1 - Graceful Connection Draining on Nginx & Prometheus Target Sync
        if: steps.select_lifo.outputs.skip_scale_in == 'false'
        working-directory: /opt/meowcloud-iac/ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          echo "=== [1/3] RÚT UPSTREAM KHỎI NGINX LOAD BALANCER ==="
          ansible-playbook -i inventory.ini playbooks/02-setup-lb.yml

          if [ "${{ inputs.scale_target }}" == "backend" ]; then
            echo "=== [2/3] RÚT UPSTREAM BACKEND KHỎI NGINX TRÊN CÁC FRONTEND ==="
            ansible-playbook -i inventory.ini playbooks/04-setup-frontend.yml
          fi

          echo "=== [3/3] CẬP NHẬT PROMETHEUS SCRAPE TARGETS ==="
          ansible-playbook -i inventory.ini playbooks/06-setup-observer.yml

      - name: Step 2 - Wait for In-Flight Requests to Drain to Zero (fail-closed)
        if: steps.select_lifo.outputs.skip_scale_in == 'false'
        shell: bash
        run: |
          set -euo pipefail
          RET_IP="${{ steps.select_lifo.outputs.retiring_ip }}"
          RET_PORT="${{ steps.select_lifo.outputs.retiring_port }}"
          echo "[*] Waiting for established TCP connections to drain on ${RET_IP}:${RET_PORT}..."
          DRAINED=false
          for i in {1..30}; do
            if ! ACTIVE_CONN=$(ssh -i /home/github-runner/.ssh/id_ed25519 \
                -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=5 "root@${RET_IP}" \
                "bash -o pipefail -c \"ss -Htn state established '( sport = :${RET_PORT} )' | wc -l\""); then
              echo "::error::SSH or ss failed on retiring guest ${RET_IP}; refusing Terraform destroy."
              exit 1
            fi
            ACTIVE_CONN=$(printf '%s' "$ACTIVE_CONN" | tr -d '[:space:]')
            if [[ ! "$ACTIVE_CONN" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid connection count from ${RET_IP}: '$ACTIVE_CONN'"
              exit 1
            fi
            echo "Drain check ${i}/30: established connections = ${ACTIVE_CONN}"
            if (( ACTIVE_CONN == 0 )); then
              DRAINED=true
              break
            fi
            sleep 1
          done
          if [ "$DRAINED" != "true" ]; then
            echo "::error::Drain timed out while active connections remain; refusing Terraform destroy."
            exit 1
          fi
          echo "[OK] Retiring guest has no established TCP connections."

      - name: Step 3 - Terraform Plan & Controlled Scale-In Gate
        if: steps.select_lifo.outputs.skip_scale_in == 'false'
        working-directory: /opt/meowcloud-iac/terraform
        run: |
          terraform init -input=false
          terraform state list | grep -q '^proxmox_virtual_environment_container\.' || {
            echo "::error::Terraform compute state missing; refusing scale-in."
            exit 1
          }
          terraform plan \
            -input=false \
            -parallelism=1 \
            -var-file=/opt/meowcloud-iac/state/autoscale.tfvars.json \
            -out=tfplan_scale_in

          terraform show -json tfplan_scale_in > tfplan_scale_in.json
          python3 "$GITHUB_WORKSPACE/scripts/verify_tfplan.py" tfplan_scale_in.json \
            --allow-scale-in \
            --expected-vmid "${{ steps.select_lifo.outputs.retiring_vmid }}"

      - name: Step 4 - Terraform Apply (Terminate Drained LXC)
        id: apply
        if: steps.select_lifo.outputs.skip_scale_in == 'false'
        working-directory: /opt/meowcloud-iac/terraform
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          terraform apply \
            -input=false \
            -parallelism=1 \
            -auto-approve \
            tfplan_scale_in
          echo "applied=true" >> "$GITHUB_OUTPUT"
          rm -f tfplan_scale_in tfplan_scale_in.json

      - name: Step 5 - Post-Scale-In VIP Healthcheck
        if: steps.select_lifo.outputs.skip_scale_in == 'false'
        run: |
          curl -fsS http://192.168.150.100/lb-status
          curl -fsS http://192.168.150.100/api/health
          cd /opt/meowcloud-iac/ansible
          ansible-playbook -i inventory.ini playbooks/07-service-isolation.yml
          echo "[OK] Thu hồi LXC ${{ steps.select_lifo.outputs.retiring_host }} (VMID ${{ steps.select_lifo.outputs.retiring_vmid }}) hoàn tất; service gate PASS."

      - name: Restore desired state only when apply was NOT attempted
        if: ${{ failure() && steps.apply.outputs.attempted != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STATE_BACKUP:-}" ] && [ -z "${INVENTORY_BACKUP:-}" ]; then
            echo "[*] Failure before backup creation; no capacity/inventory changes to restore."
            exit 0
          fi
          test -s "${STATE_BACKUP:-}" && test -s "${INVENTORY_BACKUP:-}" || {
            echo "::error::Missing pre-scale-in backups; manual inspection required."
            exit 1
          }
          cp -p "$STATE_BACKUP" /opt/meowcloud-iac/state/autoscale.tfvars.json
          cp -p "$INVENTORY_BACKUP" /opt/meowcloud-iac/ansible/inventory.ini
          echo "State and inventory restored before any Terraform apply."
          cd /opt/meowcloud-iac/ansible
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          if [ "${{ inputs.scale_target }}" = "backend" ]; then
            ansible-playbook -i inventory.ini playbooks/04-setup-frontend.yml
          fi
          ansible-playbook -i inventory.ini playbooks/02-setup-lb.yml
          ansible-playbook -i inventory.ini playbooks/06-setup-observer.yml

      - name: Report partial or completed apply failure without destructive rollback
        if: ${{ failure() && steps.apply.outputs.attempted == 'true' }}
        shell: bash
        run: |
          echo "::error::Terraform apply was attempted. No automatic reapply/rollback to avoid recreating a partially removed LXC. Inspect tfstate, guest resources, and desired capacity manually."
