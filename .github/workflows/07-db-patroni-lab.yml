name: "07 - PostgreSQL Patroni HA Lab (Takeover, Health, Writer Proxy)"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare=stage; takeover=adopt DB01 then DB02; health=read-only; proxy=writer LB"
        type: choice
        options: [prepare, takeover, health, proxy, diagnose, gateway-repair, resume]
        # Safe default for an already-running Patroni cluster; no service changes.
        default: health
        required: true
      confirmation:
        description: "takeover: TAKEOVER_PATRONI_LAB; repair: ENABLE_ETCD_HTTP_GATEWAY; resume: RESUME_PATRONI_LAB; proxy: ENABLE_DB_WRITER_PROXY"
        type: string
        default: ""
        required: false

permissions:
  contents: read

# Block Day-0 (workflow 01) from recreating meow-postgres mid-handover.
concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

jobs:
  gate:
    name: "01 • Verify inventory, etcd 3/3 and explicit approval"
    runs-on: self-hosted
    timeout-minutes: 12
    if: ${{ inputs.mode != 'diagnose' && inputs.mode != 'gateway-repair' }}
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deliberate confirmation before any live state changes
        run: |
          set -euo pipefail
          case "$MODE" in
            prepare|health|diagnose) test -z "$CONFIRM" ;;
            takeover) test "$CONFIRM" = "TAKEOVER_PATRONI_LAB" ;;
            resume) test "$CONFIRM" = "RESUME_PATRONI_LAB" ;;
            proxy) test "$CONFIRM" = "ENABLE_DB_WRITER_PROXY" ;;
            *) echo "::error::Unsupported DB07 mode"; exit 1 ;;
          esac
          test -s "$INVENTORY"
          test -s /home/github-runner/.ssh/id_ed25519
          test -s /home/github-runner/.vault_pass
          python3 scripts/db07_patroni_preflight.py --inventory "$INVENTORY" --validate-inventory-only
          for pb in 18-prepare-patroni-lab 19-takeover-patroni-lab 20-verify-patroni-lab 21-configure-db-writer-proxy 22-enable-etcd-gateway 23-resume-patroni-lab 24-guard-patroni-reentry 25-verify-patroni-local-hba; do
            /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook --syntax-check -i "$INVENTORY" "ansible/playbooks/$pb.yml"
          done

      - name: Refuse any repeated prepare/takeover after Patroni adoption
        if: ${{ inputs.mode == 'prepare' || inputs.mode == 'takeover' }}
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/24-guard-patroni-reentry.yml

      - name: Verify voter placement before an intentional one-time handover
        if: ${{ inputs.mode == 'prepare' || inputs.mode == 'takeover' || inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          python3 scripts/db06_pve_placement.py

      - name: Verify 3/3 etcd gRPC quorum AND Patroni /v3 JSON gateway (read-only)
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/16-verify-etcd-quorum.yml

  prepare:
    name: "02 • Build, transfer and stage Patroni PostgreSQL 15 image + mTLS"
    needs: gate
    if: ${{ inputs.mode == 'prepare' || inputs.mode == 'takeover' }}
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      REPL_SECRET: ${{ secrets.POSTGRES_REPLICATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned-per-commit Patroni image and send it to both DB VMs
        run: |
          set -euo pipefail
          image="meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"
          docker build --file docker/db-patroni/Dockerfile --tag "$image" .
          for ip in 192.168.150.71 192.168.150.72; do
            docker save "$image" | ssh -T -i /home/github-runner/.ssh/id_ed25519 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/github-runner/.ssh/known_hosts \
              "root@$ip" docker load
            ssh -T -n -i /home/github-runner/.ssh/id_ed25519 \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/github-runner/.ssh/known_hosts \
              "root@$ip" "docker image inspect '$image' >/dev/null"
            echo "PASS: $ip imported image $image"
          done
      - name: Stage non-root configuration and protected TLS client key; DO NOT stop PostgreSQL
        run: |
          set -euo pipefail
          image="meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"
          vars_file="$(mktemp)"
          chmod 0600 "$vars_file"
          trap 'rm -f "$vars_file"' EXIT
          python3 scripts/db06_secret_vars.py "$vars_file"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/18-prepare-patroni-lab.yml \
            -e "@$vars_file" -e pg_prepare_patroni=true \
            -e "patroni_image=$image"

  takeover:
    name: "03 • Replace standalone Docker with Patroni, DB01 before DB02"
    needs: [gate, prepare]
    if: ${{ inputs.mode == 'takeover' && needs.prepare.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 28
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Adopt existing PGDATA under Patroni; never start competing old PostgreSQL
        run: |
          set -euo pipefail
          image="meowcloud-patroni:pg15-${GITHUB_SHA:0:12}"
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/19-takeover-patroni-lab.yml \
            -e pg_takeover_approved=true -e "patroni_image=$image"
      - name: On takeover failure, collect both DBs' read-only Patroni startup diagnostics
        if: ${{ failure() }}
        run: |
          python3 scripts/db07_patroni_diagnose.py

      - name: Verify unique leader, streaming replica, PGDATA lineage and rewind hint
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/20-verify-patroni-lab.yml

  health:
    name: "04 • Read-only Patroni post-takeover health (any primary)"
    needs: gate
    if: ${{ inputs.mode == 'health' || inputs.mode == 'proxy' }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Require one writable leader and one streaming standby
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/20-verify-patroni-lab.yml

  hba:
    name: "05 • Read-only effective PostgreSQL HBA validation (both roles)"
    needs: health
    if: ${{ inputs.mode == 'health' || inputs.mode == 'proxy' }}
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Assert local physical replication HBA entries survive failover
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/25-verify-patroni-local-hba.yml

  proxy:
    name: "06 • Configure writer HAProxy 5432 on LB01 and LB02"
    needs: [gate, health, hba]
    if: ${{ inputs.mode == 'proxy' && needs.health.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Check LB-to-Patroni health connectivity and install only HAProxy
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/21-configure-db-writer-proxy.yml \
            -e pg_enable_writer_proxy=true

  writer-smoke:
    name: "07 • End-to-end DB health via application VIP (read-only)"
    needs: [health, hba, proxy]
    if: ${{ always() && (inputs.mode == 'health' || inputs.mode == 'proxy') && needs.health.result == 'success' && needs.hba.result == 'success' && (inputs.mode != 'proxy' || needs.proxy.result == 'success') }}
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify active backend can query the single PostgreSQL writer via VIP
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-delay 2 --max-time 7 http://192.168.150.100/api/db-health)"
          printf '%s\n' "$response" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("status") == "UP", p'
          echo "PASS: application DB health through VIP; primary and replication verified in earlier jobs"

  diagnose:
    name: "00 • Read-only Patroni failure diagnostics (no DCS dependency)"
    if: ${{ inputs.mode == 'diagnose' }}
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      HOME: /home/github-runner
    steps:
      - uses: actions/checkout@v4
      - name: Inspect DB01/DB02 Docker state and sanitized Patroni logs (no writes)
        run: |
          set -euo pipefail
          python3 scripts/db07_patroni_diagnose.py | tee "$RUNNER_TEMP/db07-patroni-readonly.txt"
          {
            echo "### DB07 read-only Patroni role snapshot (not takeover authorization)"
            grep -E '^(=== DB07|PATRONI INTERPRETATION:|DIAGNOSTICS COMPLETE:)' \
              "$RUNNER_TEMP/db07-patroni-readonly.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"

  gateway-repair:
    name: "00 • Enable Patroni-compatible etcd /v3 gateway (3-voter rolling)"
    if: ${{ inputs.mode == 'gateway-repair' }}
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
      CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deliberate etcd repair approval and inspect runtime inventory
        run: |
          set -euo pipefail
          test "$CONFIRM" = "ENABLE_ETCD_HTTP_GATEWAY"
          test -s "$INVENTORY"
          test -s /home/github-runner/.ssh/id_ed25519
          python3 scripts/db07_patroni_preflight.py --inventory "$INVENTORY" --validate-inventory-only
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook \
            --syntax-check -i "$INVENTORY" ansible/playbooks/22-enable-etcd-gateway.yml

      - name: Enable JSON HTTP API per voter while preserving 2/3 etcd quorum
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/22-enable-etcd-gateway.yml \
            -e db07_gateway_repair_approved=true

      - name: Require native etcd gRPC and Patroni HTTP /v3 gateway both healthy
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/16-verify-etcd-quorum.yml

      - name: Collect etcd status on failure without modifying its data
        if: ${{ failure() }}
        run: |
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/17-diagnose-etcd.yml || true

  resume:
    name: "06 • Resume interrupted takeover using original DB01 Patroni image"
    needs: gate
    if: ${{ inputs.mode == 'resume' && needs.gate.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 18
    env:
      HOME: /home/github-runner
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      INVENTORY: /opt/meowcloud-iac/ansible/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - name: Verify DB01 original Patroni is primary, then take over legacy DB02
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/23-resume-patroni-lab.yml -e pg_resume_takeover_approved=true
      - name: Require the resumed cluster to have one writer, streaming standby and matching lineage
        run: |
          set -euo pipefail
          /home/github-runner/.venvs/ansible-2.21/bin/ansible-playbook -i "$INVENTORY" \
            ansible/playbooks/20-verify-patroni-lab.yml
      - name: Diagnose any resume error without starting the legacy PostgreSQL
        if: ${{ failure() }}
        run: |
          python3 scripts/db07_patroni_diagnose.py

  failure-diagnostic:
    name: "99 • Automatic read-only diagnostics on any DB07 job failure"
    needs: [gate, prepare, takeover, health, hba, proxy, writer-smoke, resume, gateway-repair]
    if: ${{ always() && inputs.mode != 'diagnose' && contains(needs.*.result, 'failure') }}
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      HOME: /home/github-runner
    steps:
      - uses: actions/checkout@v4
      - name: Collect bounded, redacted Docker/Patroni errors without touching PGDATA
        run: |
          set -euo pipefail
          python3 scripts/db07_patroni_diagnose.py
