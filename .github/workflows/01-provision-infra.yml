# ==============================================================================
# FILE: .github/workflows/01-provision-infra.yml
# CHỨC NĂNG: Cấp phát hạ tầng MeowCloud từ Golden Images & Đo lường tốc độ triển khai
# ==============================================================================
name: "01 - Provision MeowCloud Infrastructure"

on:
  workflow_dispatch:
    inputs:
      backend_count:
        description: "Số lượng LXC Backend khởi tạo (Mặc định: 3)"
        required: true
        default: "3"
        type: string
      frontend_count:
        description: "Số lượng LXC Frontend khởi tạo (Mặc định: 3)"
        required: true
        default: "3"
        type: string
      db_count:
        description: "Số lượng KVM Database khởi tạo (Mặc định: 2)"
        required: true
        default: "2"
        type: string
      tf_parallelism:
        description: "Số luồng Terraform chạy song song (Khuyên dùng: 1 để tránh cfs-lock)"
        required: true
        default: "1"
        type: string
      initial_app_release:
        description: "Day-0 application: baseline (clean demo) or pinned (resume a published release)"
        required: true
        default: "baseline"
        type: choice
        options:
          - baseline
          - pinned

concurrency:
  group: meowcloud-iac-state
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
  TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
  TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
  CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
  ANSIBLE_FORCE_COLOR: "1"
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PVE_HOST: "192.168.150.49"

jobs:
  provision-and-configure:
    name: "Deploy from Golden Images & Benchmark"
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      INITIAL_APP_RELEASE: ${{ inputs.initial_app_release }}

    steps:
      - name: "0. Abort if autoscale webhook is active"
        run: |
          set -euo pipefail
          if systemctl is-active --quiet meowcloud-webhook.service; then
            echo "::error::Autoscale webhook is ACTIVE. Stop it on CT120 before 01/02."
            exit 1
          fi
          echo "[PASS] Autoscale webhook is not active"

      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      - name: "2. Pre-flight Check (State Dir, SSH Key, Vault & Golden Images)"
        run: |
          set -euo pipefail
          case "$INITIAL_APP_RELEASE" in
            baseline|pinned) echo "Day-0 app mode: $INITIAL_APP_RELEASE" ;;
            *) echo "::error::Invalid initial_app_release"; exit 1 ;;
          esac
          echo "=== [1] Kiểm tra thư mục Terraform State & Khóa SSH ==="
          sudo mkdir -p /opt/meowcloud-iac/state
          sudo chown -R $(whoami):$(whoami) /opt/meowcloud-iac

          # Keep ONE canonical runner identity for Terraform, Ansible, PVE SSH
          # and bootstrap_meowcrud.py. Do not depend on the shell's HOME.
          SSH_KEY_DIR="/home/github-runner/.ssh"
          SSH_KEY_PATH="$SSH_KEY_DIR/id_ed25519"
          install -d -m 0700 "$SSH_KEY_DIR"
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY_PATH"
            chmod 600 "$SSH_KEY_PATH"
          elif [ ! -s "$SSH_KEY_PATH" ]; then
            echo "::error::Missing canonical runner SSH key at $SSH_KEY_PATH"
            exit 1
          fi
          test -r "$SSH_KEY_PATH"
          ssh-keygen -y -f "$SSH_KEY_PATH" > "$SSH_KEY_PATH.pub"
          chmod 644 "$SSH_KEY_PATH.pub"
          echo "[PASS] Canonical runner SSH identity and public key available"

          echo "=== [2] Kiểm tra mật khẩu giải mã Ansible Vault ==="
          if [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
            chmod 600 ~/.vault_pass
          elif [ ! -f ~/.vault_pass ]; then
            echo "ERROR: Thiếu ~/.vault_pass hoặc Secret ANSIBLE_VAULT_PASSWORD!"
            exit 1
          fi

          echo "=== [3] Kiểm tra sự tồn tại của các Golden Images ==="
          SSH_CMD="ssh -o StrictHostKeyChecking=no -i /home/github-runner/.ssh/id_ed25519 root@${PVE_HOST}"

          # Kiểm tra Base LXC (Tarball trên CephFS)
          $SSH_CMD "test -f /mnt/pve/shared-fs/template/cache/meowcloud-lxc-base-debian12-v2.tar.zst" || {
            echo "ERROR: Thiếu meowcloud-lxc-base-debian12-v2.tar.zst!"
            exit 1
          }

          for role in lb observer tunnel; do
            $SSH_CMD "test -s /mnt/pve/shared-fs/template/cache/meowcloud-lxc-${role}-debian12-v2.tar.zst" || {
              echo "ERROR: Missing clean role archive $role. Run workflow 00."; exit 1;
            }
          done

          # Chọn template theo ưu tiên 9100 -> 9101 -> 9102.
          # Bộ chọn kiểm tra node online, template flag, SSH-bootstrap marker
          # và rootfs trên general_pool trước khi Terraform được phép chạy.
          echo "=== Chọn LXC Docker Template hợp lệ (9100 -> 9101 -> 9102) ==="
          TEMPLATE_SELECTION="$RUNNER_TEMP/lxc-template-selection.json"

          python3 scripts/select_lxc_template.py > "$TEMPLATE_SELECTION" || {
            echo "ERROR: Không có template LXC Docker hợp lệ trên node online."
            echo "Chưa chạy Terraform; kiểm tra workflow 00 và Proxmox cluster."
            exit 1
          }

          jq -r '"OK: Chọn template VMID \(.vm_id) trên node \(.node_name)"' \
            "$TEMPLATE_SELECTION"

          # Kiểm tra file cấu hình KVM được đồng bộ trên toàn cụm Cluster
          for vmid in 9001 9002 9003; do
            $SSH_CMD "ls /etc/pve/nodes/*/qemu-server/${vmid}.conf" >/dev/null 2>&1 || {
              echo "ERROR: Thiếu KVM Template $vmid! Hãy chạy workflow 00-build-golden-images.yml trước."
              exit 1
            }
          done
          echo "OK: Đầy đủ tất cả Golden Images (Base LXC, Docker LXC 9100, KVM DB)!"

      - name: "2b. Enforce desired 30s/30s/90s PVE per-node boot staggering"
        run: |
          set -euo pipefail
          python3 scripts/pve_cluster_policy.py --mode set-startup-delay

      - name: "3. Start Benchmark Timer, Detect AI Scale & Terraform Apply"
        working-directory: ./terraform
        run: |
          TOTAL_START=$(date +%s)
          TF_START=$(date +%s)
          echo "TOTAL_START=$TOTAL_START" >> $GITHUB_ENV
          echo "TF_START=$TF_START" >> $GITHUB_ENV

          BACKEND_CNT="${{ github.event.inputs.backend_count || '3' }}"
          FRONTEND_CNT="${{ github.event.inputs.frontend_count || '3' }}"
          DB_CNT="${{ github.event.inputs.db_count || '2' }}"
          PARALLEL="${{ github.event.inputs.tf_parallelism || '1' }}"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -i /home/github-runner/.ssh/id_ed25519 root@${PVE_HOST}"

          echo "=== Kiểm tra chống phân mảnh do AI Auto-scale ==="
          # Đếm số lượng cấu hình LXC Backend (VMID 151+) hiện có trên toàn cụm
          ACTUAL_BE_COUNT=$($SSH_CMD "ls -1 /etc/pve/nodes/*/lxc/ | grep -E '^15[1-9]\.conf$' | wc -l" || echo "$BACKEND_CNT")

          # Never silently increase declared day-0 capacity based on leftovers.
          # Clean replay must be deterministic; drift needs explicit remediation.
          if [ "$ACTUAL_BE_COUNT" -gt "$BACKEND_CNT" ]; then
            echo "::error::Actual Backend LXC count ($ACTUAL_BE_COUNT) exceeds requested ($BACKEND_CNT). Scale-in or reconcile before running 01."
            exit 1
          fi

          echo "BASELINE_BACKEND_CNT=$BACKEND_CNT" >> "$GITHUB_ENV"
          echo "BASELINE_FRONTEND_CNT=$FRONTEND_CNT" >> "$GITHUB_ENV"
          echo "BASELINE_DB_CNT=$DB_CNT" >> "$GITHUB_ENV"

          terraform init -input=false
          terraform validate

          # Plan first. Never let Day-0 implicitly destroy or replace workloads.
          TFPLAN="$RUNNER_TEMP/meowcloud-day0.tfplan"
          terraform plan -input=false -parallelism="${PARALLEL}" \
            -var="backend_count=${BACKEND_CNT}" \
            -var="frontend_count=${FRONTEND_CNT}" \
            -var="db_count=${DB_CNT}" -out="$TFPLAN"
          terraform show -json "$TFPLAN" | python3 -c '
          import json, sys
          plan = json.load(sys.stdin)
          prohibited = []
          for item in plan.get("resource_changes", []):
              actions = item.get("change", {}).get("actions", [])
              if "delete" in actions and item.get("address") != "local_file.ansible_inventory":
                  prohibited.append((item.get("address"), actions))
          if prohibited:
              for address, actions in prohibited:
                  print(f"[BLOCK] Day-0 plan would delete/replace: {address} actions={actions}", file=sys.stderr)
              sys.exit(1)
          print("[PASS] Day-0 plan contains no workload delete/replacement.")
          '
          terraform apply -input=false -parallelism="${PARALLEL}" "$TFPLAN"
          rm -f "$TFPLAN"

          TF_END=$(date +%s)
          echo "TF_DURATION=$((TF_END - TF_START))" >> $GITHUB_ENV

      - name: "3b. Publish fresh Terraform-generated runtime inventory"
        run: |
          set -euo pipefail
          test -s ./ansible/inventory.ini || {
            echo "::error::Terraform generated no ansible/inventory.ini"; exit 1;
          }
          install -m 0644 ./ansible/inventory.ini /opt/meowcloud-iac/ansible/inventory.ini
          echo "Published current day-0 inventory for workflows 03/04/05."

      - name: "4. Wait for All LXC/KVM Nodes SSH Readiness"
        working-directory: ./ansible
        run: |
          ANS_START=$(date +%s)
          echo "ANS_START=$ANS_START" >> $GITHUB_ENV
          cat ./inventory.ini
          ansible all -m wait_for_connection -a "delay=3 timeout=300"

      - name: "5. [Tier 1] Configure Database KVM Cluster (05-setup-database.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          ansible-playbook playbooks/05-setup-database.yml

      - name: "5b. Idempotently bootstrap isolated CRUD role/database on new DB primary"
        run: |
          set -euo pipefail
          # Reuses protected CT120 credentials when present; creates role/database
          # on a newly provisioned DB VM without app tables or migrations.
          python3 scripts/bootstrap_meowcrud.py --confirm CREATE_MEOWCLOUD_DEMO_DB

      - name: "6. [Tier 2] Configure Backend API Elastic Pool (03-setup-backend.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          if [ "$INITIAL_APP_RELEASE" = "baseline" ]; then
            # Explicit override: stale app-release.json must NOT resurrect v2 after destroy.
            ansible-playbook playbooks/03-setup-backend.yml -e meow_backend_image=meow-backend:latest
          else
            ansible-playbook playbooks/03-setup-backend.yml
          fi

      - name: "7. [Tier 3] Configure Web Frontend Elastic Pool (04-setup-frontend.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          if [ "$INITIAL_APP_RELEASE" = "baseline" ]; then
            ansible-playbook playbooks/04-setup-frontend.yml -e meow_frontend_image=nginx:alpine
          else
            ansible-playbook playbooks/04-setup-frontend.yml
          fi

      - name: "8. [Tier 4] Configure HA Load Balancers & Keepalived VIP (02-setup-lb.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          ansible-playbook playbooks/02-setup-lb.yml

      - name: "9. [Tier 5] Configure Cloudflare Tunnels Ingress (01-setup-tunnels.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          ansible-playbook playbooks/01-setup-tunnels.yml

      - name: "10. [Tier 6] Configure Observer Monitoring Stack (06-setup-observer.yml)"
        working-directory: ./ansible
        run: |
          # Managed by update_meowcloud_ansible_runtime.sh
          export HOME="/home/github-runner"
          export PATH="/home/github-runner/.venvs/ansible-2.21/bin:$PATH"
          export LANG="C.UTF-8"
          export LC_ALL="C.UTF-8"

          # Deploy actual LXC cgroup CPU metric before the observer begins scraping it.
          ansible-playbook playbooks/08-setup-lxc-cpu-exporter.yml
          ansible-playbook playbooks/06-setup-observer.yml
          ANS_END=$(date +%s)
          echo "ANS_DURATION=$((ANS_END - ANS_START))" >> $GITHUB_ENV

      - name: "11. Post-Deployment Verification (Identity, VIP & Healthchecks)"
        working-directory: ./ansible
        run: |
          echo "=== [1] Kiểm tra định danh độc lập (machine-id & IP) trên toàn bộ các máy ==="
          ansible all -m shell -a "echo -n 'Host: $(hostname) | IP: $(hostname -I | awk \"{print \$1}\") | Machine-ID: ' && cat /etc/machine-id"

          echo "=== [1b] Verify MeowCloud Frontend content instead of Nginx default page ==="
          if [ "$INITIAL_APP_RELEASE" = "baseline" ]; then
            curl -fsS http://192.168.150.100/ | grep -q 'Welcome to nginx!'
          else
            curl -fsS http://192.168.150.100/ | grep -q 'MeowCloud Elastic Infrastructure'
          fi

          echo "=== [2] Kiểm tra phản hồi từ Keepalived VIP (192.168.150.100) ==="
          curl -f -s http://192.168.150.100/lb-status
          curl -f -s http://192.168.150.100/api/health
          echo ""

          echo "=== [3] Service isolation check ==="
          ansible-playbook playbooks/07-service-isolation.yml
          echo "=== [4] Publish validated initial app release ==="
          if [ "$INITIAL_APP_RELEASE" = "baseline" ]; then
            # Leave versioned v1/v2 snapshots untouched for later 05R replay.
            python3 ../scripts/demo_release.py publish --target baseline --confirm PUBLISH-VERIFIED-RELEASE
          else
            echo "Preserving previously published app-release.json (pinned mode)."
          fi
          echo "=== [5] Baseline autoscale state ==="
          mkdir -p /opt/meowcloud-iac/state
          jq -n --argjson be "$BASELINE_BACKEND_CNT" --argjson fe "$BASELINE_FRONTEND_CNT" \
            '{backend_count:$be, frontend_count:$fe, backend_node_map:{}, frontend_node_map:{}}' \
            > /opt/meowcloud-iac/state/autoscale.tfvars.json
          chmod 600 /opt/meowcloud-iac/state/autoscale.tfvars.json

          TOTAL_END=$(date +%s)
          TOTAL_DURATION=$((TOTAL_END - TOTAL_START))

          echo "## 📊 Kết quả Đo lường Thời gian Triển khai (Packer Golden Images)" >> $GITHUB_STEP_SUMMARY
          echo "| Giai đoạn | Thời gian thực thi (Giây) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Terraform Provisioning (Clone Golden Images + Firewall)** | **${TF_DURATION}s** |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Ansible Service Configuration (6 Tiers + Wait SSH)** | **${ANS_DURATION}s** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tổng thời gian hoàn tất (End-to-End)** | **${TOTAL_DURATION}s** |" >> $GITHUB_STEP_SUMMARY

      - name: "11b. Restore DB VM-specific startup order without changing CT120"
        run: |
          set -euo pipefail
          python3 scripts/pve_cluster_policy.py --mode set-guest-startup

      - name: "12. Register HA Manager for Observer CT121 + DB Primary VM271 only"
        run: |
          set -euo pipefail
          python3 scripts/pve_cluster_policy.py --mode apply-ha
          python3 scripts/pve_cluster_policy.py --mode audit
