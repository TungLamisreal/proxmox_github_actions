name: Grafana autoscale dashboard CI
on:
  pull_request:
    paths:
      - 'monitoring/grafana/**'
      - 'ansible/playbooks/06-setup-observer.yml'
      - 'ansible/playbooks/28-setup-webhook-journal.yml'
      - '.github/workflows/grafana-ci.yml'
      - '.github/workflows/01-provision-infra.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start a disposable Prometheus with BE and FE scrape targets
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prom.yml" <<'YAML'
          global:
            scrape_interval: 2s
          scrape_configs:
            - job_name: lxc_backends
              static_configs:
                - {targets: ['127.0.0.1:9090'], labels: {machine: backend-01}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: backend-02}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: backend-03}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: backend-04}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: backend-05}}
              metric_relabel_configs: &metrics
                - {source_labels: [__name__], regex: process_cpu_seconds_total, target_label: __name__, replacement: meowcloud_lxc_cpu_usage_seconds_total}
                - {source_labels: [__name__], regex: prometheus_build_info, target_label: __name__, replacement: meowcloud_lxc_cpu_capacity_cores}
            - job_name: lxc_frontends
              static_configs:
                - {targets: ['127.0.0.1:9090'], labels: {machine: frontend-01}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: frontend-02}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: frontend-03}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: frontend-04}}
                - {targets: ['127.0.0.1:9090'], labels: {machine: frontend-05}}
              metric_relabel_configs: *metrics
          YAML
          docker run -d --name test-prom --network host -v "$RUNNER_TEMP/prom.yml:/etc/prometheus/prometheus.yml:ro" prom/prometheus:v3.5.0 --config.file=/etc/prometheus/prometheus.yml --web.listen-address=:9090
      - name: Validate Observer playbook carries the Grafana and etcd guards
        run: |
          grep -q 'GF_SERVER_HTTP_ADDR=0.0.0.0' monitoring/grafana/grafana.service
          grep -q '99-meowcloud-http-listen.conf' ansible/playbooks/06-setup-observer.yml
          grep -q 'Verify Grafana API on Observer service IP' ansible/playbooks/06-setup-observer.yml
          grep -q 'Verify CT120 can reach Grafana TCP 3000' ansible/playbooks/06-setup-observer.yml
          # Avoid restarting Grafana while 03/04 refresh Observer scrape targets.
          grep -q "grafana_listener_override.changed else 'started'" ansible/playbooks/06-setup-observer.yml
          grep -q 'Verify three-voter consensus before installing Grafana' ansible/playbooks/06-setup-observer.yml
          grep -q 'Recheck three-voter consensus after the Grafana attempt' ansible/playbooks/06-setup-observer.yml
          test ! -e ansible/playbooks/27-observer-grafana.yml
          # Dashboard must show every LXC dynamically (not a fixed 3/3 or 4/4 list).
          python3 - <<'PY'
          import json
          from pathlib import Path
          panels = json.loads(Path("monitoring/grafana/autoscale.json").read_text())["panels"]
          assert len(panels) == 3
          assert panels[0]["type"] == "meowcloud-alertlog-panel"
          assert panels[0]["gridPos"] == {"x": 0, "y": 0, "w": 24, "h": 10}
          for target, state in zip(panels[0]["targets"], ("pending", "firing")):
              assert f'alertstate="{state}"' in target["expr"]
              assert "or vector(0)" in target["expr"]
          for panel in panels[1:]:
              assert panel["type"] == "bargauge"
              assert panel["gridPos"]["y"] == 10
              assert panel["gridPos"]["h"] == 7
              query = panel["targets"][0]["expr"]
              assert "sum by (machine)" in query and "/ on(machine)" in query
              assert panel["targets"][0]["legendFormat"] == "{{machine}}"
              assert panel["fieldConfig"]["defaults"]["thresholds"]["steps"][-1]["value"] == 75
          playbook = Path("ansible/playbooks/06-setup-observer.yml").read_text()
          assert playbook.count("> 75)") == 2
          assert "> 80)" not in playbook
          assert playbook.count("machine: '{{ host }}'") == 2
          PY
      - name: Test read-only journal and start disposable source
        run: |
          pip install ansible-core==2.19.3
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbooks/28-setup-webhook-journal.yml
          python3 -m unittest discover -s tests -p 'test_alert_batching.py' -v
          python3 -m unittest discover -s monitoring/grafana/journal -p 'test_*.py' -v
          python3 monitoring/grafana/journal/fixture.py > /tmp/journal-fixture.log 2>&1 &
          sudo mkdir -p /etc/meowcloud-grafana/datasources
          sudo tee /etc/meowcloud-grafana/datasources/webhook-journal.yaml > /dev/null <<'YAML'
          apiVersion: 1
          datasources:
            - name: CI Webhook Journal
              uid: meow-journal
              type: loki
              access: proxy
              url: http://127.0.0.1:5011
              jsonData:
                httpHeaderName1: Authorization
              secureJsonData:
                httpHeaderValue1: Bearer ci-journal-token
          YAML
      - name: Install twice and verify every panel query through Grafana
        working-directory: monitoring/grafana
        run: |
          set -euo pipefail
          sudo bash install.sh
          before=$(systemctl show -p InvocationID --value meowcloud-grafana)
          sudo bash install.sh
          test -n "$before"
          test "$before" = "$(systemctl show -p InvocationID --value meowcloud-grafana)"
      - name: Verify half-screen dashboard with five machines per tier and long logs
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("/opt/meowcloud-grafana-13.3.0/public/build").glob("*.js"):
              text = p.read_text()
              i = text.find("Could not load plugin")
              if i >= 0:
                  print("PLUGIN LOADER", text[max(0, i-1800):i+500])
                  break
          PY
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node monitoring/grafana/test-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafana-half-screen
          path: /tmp/meow-dashboard.png
      - name: Show Grafana startup errors
        if: failure()
        working-directory: monitoring/grafana
        run: sudo journalctl -u meowcloud-grafana -n 100 --no-pager
