name: Proxmox Zero Trust CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy-infrastructure:
    runs-on: self-hosted

    env:
      RUNNER_ALLOW_RUNASROOT: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        working-directory: ./proxmox-iac
        run: terraform init

      - name: Terraform Apply
        working-directory: ./proxmox-iac
        # Chạy Terraform đẻ/cập nhật 8 máy ảo
        run: terraform apply -auto-approve

      - name: Ansible - Config Zero Trust Tunnels
        working-directory: ./ansible-iac
        run: |
          # Tạm thời tắt check host key để không bị hỏi Yes/No khi SSH
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i inventory.ini setup_tunnels.yml

      - name: Ansible - Config Loadbalancer & Backend
        working-directory: ./ansible-iac
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i inventory.ini setup_app.yml
