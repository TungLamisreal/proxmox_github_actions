---
- name: Cài đặt và cấu hình Nginx cho cụm Backend
  hosts: backends
  gather_facts: no

  tasks:
    - name: Chờ máy ảo khởi động và mở cổng SSH
      wait_for_connection:
        delay: 5      # Đợi 5 giây rồi mới bắt đầu gõ cửa
        timeout: 120  # Kiên nhẫn đứng gõ cửa tối đa 120 giây (2 phút)

    - name: Bật lại tính năng thu thập thông tin (Gather Facts)
      setup:

    - name: Cập nhật danh sách gói (apt update)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Cài đặt các gói phần mềm (Nginx, Curl)
      apt:
        name:
          - nginx
          - curl
        state: present

    - name: Đảm bảo Nginx đang chạy và tự bật cùng hệ thống
      service:
        name: nginx
        state: started
        enabled: yes

    # --- 1. Cài đặt công cụ tạo chứng chỉ ---
    - name: Cai dat OpenSSL
      apt: { name: openssl, state: present }

    # --- 2. Tạo chứng chỉ SSL tự ký (Ma thuật nằm ở đây) ---
    - name: Tao chung chi SSL tu ky (Self-signed) cho Nginx
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/ssl/private/nginx-selfsigned.key
        -out /etc/ssl/certs/nginx-selfsigned.crt
        -subj "/C=VN/ST=HCM/L=HCM/O=DevOps/CN=api.meowcloud.io.vn"
      args:
        creates: /etc/ssl/certs/nginx-selfsigned.crt # Thấy có rồi thì bỏ qua, không tạo lại

    # --- 3. Mở cửa Firewall cho cổng 443 ---
    - name: Mo port 443 (HTTPS) tren Firewall UFW
      ufw: { rule: allow, port: '443', proto: tcp }

    # --- 4. Cấu hình lại file Nginx để ép nó chạy SSL và trỏ xuống Backend ---
    # LƯU Ý: Chỗ 'backend_pool' bác nhớ điền đúng IP các máy Backend của bác nhé
    - name: Cau hinh Nginx Load Balancer chay HTTPS
      copy:
        dest: /etc/nginx/conf.d/loadbalancer.conf
        content: |
          upstream backend_pool {
              # Ma thuật Jinja2: Tự động lặp qua tất cả IP trong nhóm [backend]
              {% for ip in groups['backend'] %}
              server {{ ip }}:80;
              {% endfor %}
          }

          # Bắt ai gõ HTTP (80) cũng phải vòng sang HTTPS (443)
          server {
              listen 80;
              server_name _;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name _;

              # Chỉ điểm vị trí 2 file chứng chỉ vừa tạo ở Task 2
              ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
              ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

              location / {
                  proxy_pass http://backend_pool;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx  # Đảm bảo bác đã có Handler "Restart Nginx" ở cuối file nhé

    handlers:
      - name: Restart Nginx
      service:
        name: nginx
        state: restarted
