---
# ==========================================
# PLAY 1: RẢI ĐIỆP VIÊN (NODE EXPORTER) LÊN TOÀN HỆ THỐNG
# ==========================================
- name: Deploy Node Exporters to ALL machines
  hosts: proxmox_project # Chỉ định Ansible chui vào TẤT CẢ các IP thuộc nhóm proxmox_project trong file inventory.ini
  become: yes # Trở thành user 'root' để có quyền cài đặt phần mềm
  tasks:
    - name: Cai dat Prometheus Node Exporter tu kho Debian
      apt: # Gọi module 'apt' (quản lý gói của Debian/Ubuntu)
        name: prometheus-node-exporter # Tên phần mềm cần cài
        state: present # Lệnh cho Ansible: Đảm bảo phần mềm này "phải có mặt" (được cài đặt)
        update_cache: yes # Chạy 'apt update' trước khi cài để lấy danh sách gói mới nhất

    - name: Dam bao Node Exporter luon chay
      systemd:
        name: prometheus-node-exporter
        state: started
        enabled: yes

# ==========================================
# PLAY 2: XÂY DỰNG TRẠM CHỈ HUY OBSERVER
# ==========================================
- name: Setup Prometheus and Grafana on Observer Node
  hosts: observer # Chỉ chạy kịch bản này trên IP nằm trong nhóm [observer] (192.168.150.160)
  become: yes
  tasks:
  # --- PHẦN 1: CÀI VÀ CẤU HÌNH PROMETHEUS ---
    - name: Cai dat Prometheus
      apt: { name: prometheus, state: present } # Cài đặt bộ não Prometheus

    - name: Cau hinh Prometheus tu dong quet toan bo may ao hien co
      copy: # Gọi module 'copy' để đẩy nội dung text vào thành một file trên máy đích
        dest: /etc/prometheus/prometheus.yml # Vị trí file cấu hình chính của Prometheus
        content: | # Bắt đầu ghi nội dung cấu hình
          global:
            scrape_interval: 15s # Chu kỳ đi thu thập dữ liệu là 15 giây/lần
          scrape_configs:
            - job_name: 'proxmox_infrastructure' # Tên nhóm công việc
              static_configs:
                - targets:
                  # Vòng lặp Jinja2: Tự động lôi tất cả IP từ inventory vào đây
                  {% for host in groups['all'] %}
                  - '{{ host }}:9100'
                  {% endfor %}
      notify: Restart Prometheus # Nếu file cấu hình bị thay đổi, hãy gọi Handler ở cuối file để khởi động lại Prometheus

    # --- PHẦN 2: CÀI GRAFANA (Phức tạp hơn vì phải ép kiểu kho lưu trữ chính hãng) ---
    - name: Tao thu muc chua GPG key cho Grafana
      file: { path: /etc/apt/keyrings, state: directory, mode: '0755' } # Tạo thư mục an toàn để chứa chìa khóa mã hóa

    - name: Tai GPG Key cua Grafana
      get_url: # Dùng module tải file từ Internet
        url: https://apt.grafana.com/gpg.key # Link chìa khóa của Grafana
        dest: /etc/apt/keyrings/grafana.asc # Nơi lưu chìa khóa
        mode: '0644'

    - name: Them Grafana Repository
      apt_repository: # Ép Debian dùng kho phần mềm của Grafana thay vì kho mặc định của Debian (để có bản mới nhất)
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        state: present
        filename: grafana # Tạo file /etc/apt/sources.list.d/grafana.list

    - name: Cai dat Grafana (Dashboard)
      apt: { name: grafana, state: present, update_cache: yes } # Cài Grafana từ kho vừa thêm

    - name: Khoi dong Grafana Server
      systemd: { name: grafana-server, state: started, enabled: yes } # Khởi động và cho phép chạy ngầm

  # --- HANDLERS: NHỮNG KẺ NGỦ ĐÔNG ---
  handlers:
    - name: Restart Prometheus
      systemd: { name: prometheus, state: restarted } # Đoạn code này CHỈ chạy khi được lệnh 'notify' gọi ở trên (nhằm tránh việc restart dư thừa nếu cấu hình không đổi).
